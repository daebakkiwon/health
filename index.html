<style>
:root{
  --bg:#f7f4ec; --card:#fffdf8; --ink:#1f2a24; --sub:#5d6b62; --line:#e4ddcc;
  --g:#2f6b4f; --g2:#e3efe6; --gold:#8c6d46; --keybg:#fdf3e3; --keybd:#e8cfa6;
  --verse:#3b6ea5; --chip:#efe9da; --shadow:0 1px 3px rgba(40,50,40,.08),0 4px 14px rgba(40,50,40,.05);
  --fs:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141916; --card:#1d2420; --ink:#e7ece8; --sub:#9fb0a6; --line:#2e3833;
  --g:#7cc4a0; --g2:#22352b; --gold:#d6b88a; --keybg:#2b2519; --keybd:#5a4a30;
  --verse:#8fb8e6; --chip:#26302b; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#141916; --card:#1d2420; --ink:#e7ece8; --sub:#9fb0a6; --line:#2e3833;
  --g:#7cc4a0; --g2:#22352b; --gold:#d6b88a; --keybg:#2b2519; --keybd:#5a4a30;
  --verse:#8fb8e6; --chip:#26302b; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
a{color:var(--g)}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:8px;min-height:52px}
.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;font-size:18px;line-height:1}
.ib:active{background:var(--chip)}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.muted{color:var(--sub)}
.small{font-size:13px}
h2.sec{font-size:15px;color:var(--sub);margin:22px 4px 10px;font-weight:600;letter-spacing:.02em}
.hero{background:linear-gradient(135deg,var(--g),#4d8c6a);color:#fff;border:0}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#25523d,#2f6b4f)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#25523d,#2f6b4f)}}
.hero .lab{font-size:12px;opacity:.85;letter-spacing:.08em}
.hero .q{font-size:18px;font-weight:600;line-height:1.55;margin:8px 0 10px}
.hero a{color:#fff;opacity:.9;font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.tile .e{font-size:24px}
.tile b{display:block;margin-top:4px;font-size:16px}
.tile span{font-size:12.5px;color:var(--sub)}
.chain{counter-reset:c;margin:0;padding:0;list-style:none}
.chain li{position:relative;padding:10px 0 10px 40px;border-left:2px solid var(--g2);margin-left:14px}
.chain li:before{counter-increment:c;content:counter(c);position:absolute;left:-14px;top:9px;width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
:root[data-theme="dark"] .chain li:before{color:#10251b}
.list{list-style:none;margin:0;padding:0}
.list a{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);padding:13px 4px;border-bottom:1px solid var(--line)}
.list li:last-child a{border-bottom:0}
.list .n{flex:0 0 auto;min-width:34px;height:34px;border-radius:10px;background:var(--g2);color:var(--g);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.list .t{flex:1;min-width:0}
.list .t small{display:block;color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .chk{color:var(--g);font-size:14px}
.bar{height:5px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--g)}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
:root[data-theme="dark"] .chip.on{color:#10251b}
.dz{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dz a{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;font-weight:500}
.dz a small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.cat{margin:18px 2px 8px;font-weight:700;font-size:15px}
/* reader */
.reader{font-size:var(--fs);line-height:1.85;word-break:keep-all;overflow-wrap:break-word}
.reader h2{font-size:1.25em;line-height:1.45;margin:4px 0 6px}
.reader .crumb{font-size:13px;color:var(--sub)}
.reader h3{font-size:1.05em;color:var(--gold);margin:1.8em 0 .5em}
.reader p{margin:0 0 1em}
.reader .key{background:var(--keybg);border:1px solid var(--keybd);border-radius:12px;padding:12px 14px;margin:1em 0;font-weight:600}
.reader .key:before{content:"강의 포인트";display:block;font-size:12px;color:var(--gold);font-weight:700;margin-bottom:2px}
.reader .verse{border-left:4px solid var(--verse);padding:2px 0 2px 12px;color:var(--verse);margin:1em 0}
.reader .src{font-size:12.5px;color:var(--sub);font-style:italic;margin:-.4em 0 1.4em;line-height:1.5}
.reader ul{padding-left:1.2em;margin:0 0 1em}
.reader li{margin-bottom:.4em}
.reader mark{background:#ffe58a;color:#000;border-radius:3px}
.tw{overflow-x:auto;margin:1em 0}
.reader table{border-collapse:collapse;font-size:.85em;line-height:1.55;min-width:100%}
.reader td{border:1px solid var(--line);padding:7px 9px;vertical-align:top}
.reader tr:first-child td{background:var(--g2);font-weight:700}
.nav2{display:flex;gap:10px;margin-top:24px}
.nav2 a{flex:1;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.nav2 a small{display:block;color:var(--sub);font-size:12px}
.nav2 a.r{text-align:right}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:15px}
.btn.pri{background:var(--g);color:#fff;border-color:var(--g)}
:root[data-theme="dark"] .btn.pri{color:#10251b}
.done-btn{width:100%;margin-top:18px;padding:14px}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--sub);font-size:11.5px;padding:8px 0 7px}
.tabbar a .e{display:block;font-size:20px;line-height:1.2}
.tabbar a.on{color:var(--g);font-weight:700}
/* plan */
.pc{border-radius:14px;border:1px solid var(--line);background:var(--card);margin-bottom:10px;overflow:hidden}
.pc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.pc summary::-webkit-details-marker{display:none}
.pc .L{flex:0 0 42px;height:42px;border-radius:12px;background:var(--g2);display:flex;align-items:center;justify-content:center;font-size:21px}
.pc .T{flex:1;min-width:0}
.pc .T b{font-size:16px}
.pc .T small{display:block;color:var(--sub);font-size:13px;line-height:1.4}
.pc .cnt{font-size:13px;color:var(--g);font-weight:700}
.pc .body{padding:0 14px 14px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line);cursor:pointer}
.ck input{width:22px;height:22px;accent-color:var(--g);flex:0 0 auto;margin:1px 0 0}
.why{font-size:14.5px;line-height:1.7;background:var(--chip);border-radius:10px;padding:10px 12px;margin:2px 0 10px}
.lk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lk a{font-size:12.5px;text-decoration:none;background:var(--g2);border-radius:99px;padding:4px 10px}
.week{display:flex;gap:6px;justify-content:space-between;margin-top:10px}
.week div{flex:1;text-align:center;font-size:11.5px;color:var(--sub)}
.week i{display:block;margin:4px auto 0;width:100%;max-width:40px;aspect-ratio:1;border-radius:10px;background:var(--chip);position:relative}
.week i b{position:absolute;inset:auto 0 0 0;background:var(--g);border-radius:10px}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:0 0 auto}
textarea{width:100%;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);min-height:84px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.on{opacity:.95}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer}
.seg button.on{background:var(--g);color:#fff}
.res a{display:block;text-decoration:none;color:var(--ink);padding:12px 2px;border-bottom:1px solid var(--line)}
.res a small{display:block;color:var(--sub);font-size:13px;line-height:1.55}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.notice{font-size:12.5px;color:var(--sub);line-height:1.6;padding:12px 14px;border:1px dashed var(--line);border-radius:12px}
.gate{max-width:480px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px 40px}
.gate .logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 12px}
.gate h1{text-align:center;font-size:24px;margin:0}
.gate .lead{text-align:center;color:var(--sub);margin:6px 0 22px;font-size:15px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.fld input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--sub);margin:6px 0 16px;cursor:pointer}
.agree input{width:20px;height:20px;accent-color:var(--g);flex:0 0 auto;margin:1px 0 0}
.err{color:#c0392b;font-size:14px;min-height:20px;margin-bottom:6px}
.inst{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;cursor:pointer;border:1.5px dashed var(--g)}
.inst .e{font-size:28px}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0}
.steps li{position:relative;padding:8px 0 8px 38px;font-size:15px;line-height:1.55}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--g2);color:var(--g);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--chip);font-size:13px}
.hide{display:none!important}
</style>
</head>

<script>
const IDX = {"p":{"name":"원리편","front":[{"title":"이 책에 대하여","b":[{"t":"h","x":"<b>1. 무엇을 모은 책인가<\/b>"},{"t":"p","x":"이 책은 이상구 박사의 뉴스타트 건강강의 205기 · 206기 · 207기 · 208기 · 209기 · 210기 · 211기 · 212기 · 213기 · 214기 · 215기 · 216기 · 217기 · 218기 · 219기 · 220기 · 221기 · 222기 · 223기 · 224기 · 225기 · 226기 · 227기 · 228기 · 229기 · 230기 · 231기 · 232기 · 233기 · 234기 · 235기 · 236기 · 237기 · 239기 · 240기 · 241기 · 242기 · 243기 · 244기 · 245기 · 246기 · 247기 · 248기 · 249기 · 250기 · 251기 · 252기 · 253기 · 254기 · 255기 · 256기 · 257기 · 258기 · 259기 · 260기 · 261기 · 262기 · 263기 · 264기 · 265기 · 266기 · 267기 · 268기 · 269기 · 270기 · 271기 · 272기 · 273기 · 274기 · 275기 · 276기 · 277기 · 278기 · 279기 · 280기 · 281기 · 282기 · 283기 · 284기 · 285기 · 286기 · 287기 · 288기 · 289기 · 290기 · 291기 · 292기 · 293기 · 294기 · 295기 · 302기 · 303기 · 304기 · 305기 · 307기 · 308기 · 309기 · 310기 · 311기 · 312기 · 313기 · 315기, 총 102개 기수 1827편의 강의록을 하나로 합친 것이다."},{"t":"p","x":"이 통합본은 두 권으로 나뉘어 있다. 이 권은 <b>원리편<\/b>으로 제1부 「건강의 원리」를 담고 있고, 질병별 치유 원리는 <b>질병편<\/b>에 따로 실려 있다. 부록의 예화 색인과 수록 내용 색인은 이 권에 해당하는 항목만 실었으며, 성경 구절 색인·기수별 강의 목차 대조표·개정 이력은 두 권에 똑같이 들어 있다."},{"t":"p","x":"각 기수는 대개 14~18강으로 구성되어 있고, 기수가 달라도 다루는 핵심 원리는 거의 동일하다. 같은 원리가 기수마다 다른 예화, 다른 성경 구절, 다른 환자 사례로 반복해서 설명된다. 그래서 170편을 순서대로 읽으면 같은 이야기를 열 번 읽게 되고, 정작 어느 기수에만 나오는 귀한 내용은 그 반복에 묻혀 버린다."},{"t":"p","x":"이 통합본은 그 문제를 풀기 위해 만들어졌다. 기수(강의 순서)가 아니라 주제(건강의 원리와 질병명)를 축으로 전체를 다시 배열했다. 열 기수에 걸쳐 반복되는 내용은 한 자리에 모아 가장 완전한 형태로 서술하고, 특정 기수에만 등장하는 내용은 누락 없이 해당 주제 아래로 옮겨 붙였다."},{"t":"h","x":"<b>2. 어떻게 구성되어 있는가<\/b>"},{"t":"tbl","r":[["구성","내용","쓰임새"],["제1부 건강의 원리","질병관, 유전자 스위치, 생기, 뜻과 뇌파, 기본여건, 활성산소, 정신, 사실과 진실, 행복, 장수, 관찰자, 재생 — 12개 장","강의안·교육 커리큘럼의 뼈대"],["제2부 질병별 치유 원리","암, 자가면역질환, 당뇨병, 간경화, 우울증, 거식증, 비만, 호르몬 결핍 등 질병별 원인·기전·실천·사례","상담·개별 질문 대응"],["제3부 부록","8대 원칙 요약, 용어 사전, 성경 구절 색인, 예화 색인, 기수별 목차 대조표, 수록 내용 색인","검색과 앞으로의 업데이트"]]},{"t":"h","x":"<b>3. 본문 표기 규칙<\/b>"},{"t":"li","x":"파란 세로줄 문단은 강의에서 인용된 성경 구절이다."},{"t":"li","x":"연한 갈색 상자는 그 항목의 핵심을 한 문장으로 압축한 강의 포인트다. 강의안을 만들 때 이 문장을 그대로 슬라이드 제목으로 쓸 수 있다."},{"t":"li","x":"각 항목 끝의 회색 작은 글씨는 출처 기수와 강수다. 원문 강의록을 다시 확인해야 할 때 이 표기를 따라가면 된다."},{"t":"h","x":"<b>4. 이 자료를 다룰 때의 주의<\/b>"},{"t":"p","x":"원 강의록은 유튜브 자동자막(ASR)을 바탕으로 정리된 것이다. 따라서 다음 세 가지는 인용 전에 확인이 필요하다."},{"t":"li","x":"강의 중 언급된 연구 발표 시점·논문 저자명·통계 수치는 강사의 구두 진술이며, 별도 검증을 거치지 않았다."},{"t":"li","x":"성경 장·절은 강사가 직접 밝히지 않고 취지만 말한 경우가 많아, 원 강의록에 &quot;확인필요&quot;로 표시된 항목이 상당수 있다."},{"t":"li","x":"참가자 실명은 원 강의록에서 표기가 흔들리는 경우가 있어, 이 통합본에서도 강의에서 반복 등장하는 별칭 위주로만 적었다."},{"t":"p","x":"또한 이 자료는 이상구 박사의 강의 내용을 그대로 정리한 것이며, 현대 의학의 표준 진료 지침이나 의학적 조언을 대체하지 않는다. 교육과 학습을 위한 정리물로 사용하기를 권한다."},{"t":"h","x":"<b>5. 앞으로 이 파일을 어떻게 키워 가는가<\/b>"},{"t":"p","x":"이 통합본은 완결된 책이 아니라 계속 자라는 기준 문서로 설계되었다. 새로운 기수의 강의를 정리했을 때 이 파일 전체를 다시 만들 필요가 없다. 제3부 부록의 「수록 내용 색인」과 「업데이트 절차」를 따라, 이미 들어 있는 내용은 건너뛰고 새로운 것만 해당 장에 덧붙이면 된다. 자세한 절차는 부록 6절에 있다."}]},{"title":"전체 논리 한눈에 보기","b":[{"t":"p","x":"1827편의 강의를 관통하는 논리는 단 하나의 사슬이다. 이 사슬을 이해하면 어느 강의를 펼쳐도 지금 어디를 이야기하고 있는지 알 수 있다."},{"t":"h","x":"<b>아홉 칸의 사슬<\/b>"},{"t":"tbl","r":[["단계","명제"],["1","사람의 몸은 세포로만 되어 있다. 그러므로 모든 질병은 세포의 변질이다."],["2","세포의 성질을 결정하는 것은 유전자다. 그러므로 모든 질병은 유전자의 변질이다."],["3","변질이란 유전자가 없어진 것이 아니라 꺼진 것(OFF)이다. 유전자는 후천적으로 켜지고 꺼진다(후성유전학)."],["4","유전자를 켜고 끄는 물리적 스위치는 메틸기(CH₃)의 부착(메틸화)과 제거(탈메틸화)다."],["5","메틸기는 전기를 띤 화학물질일 뿐 지능이 없다. 스스로 움직이지 못하고 생체 전자파 신호를 받아 움직인다."],["6","생체 전자파의 출발점은 뇌파이고, 뇌파를 알파파로 만들지 베타파로 만들지 결정하는 것은 뜻(의미·해석)이다."],["7","그 뜻에 담긴 힘, 곧 영적 에너지가 물리적 에너지를 지배한다. 그 영적 에너지의 이름이 생기(生氣)다."],["8","생기는 진(眞)·선(善)·미(美) 안에 담겨 있고, 이 셋을 합한 것이 사랑이며, 그중 생기의 원천은 무조건적 사랑(아가페)이다."],["9","생기는 값없이 조건 없이 주어지지만 아무 자리에나 내려앉지 않는다. 기본여건(뉴스타트 8대 원칙)이 갖추어진 자리에 온다."]]},{"t":"h","x":"<b>이 사슬이 만드는 세 가지 결론<\/b>"},{"t":"li","x":"치료(treatment)와 치유(healing)는 다르다. 약·수술·방사선은 결과를 처치할 뿐 꺼진 유전자를 켜지 못한다. 원인이 남아 있으므로 재발은 우연이 아니라 예정된 결과다."},{"t":"li","x":"불치병이라는 개념은 성립하지 않는다. 유전자가 변하지 않는다는 전제 위에서만 &quot;불치&quot;가 성립한다. 유전자가 변한다면 남는 질문은 &quot;낫느냐&quot;가 아니라 &quot;무엇이 이 유전자를 껐는가&quot;이다."},{"t":"li","x":"낫는 것이 목표가 아니다. 낫는 것만을 조건으로 삼는 순간 그것 자체가 조건적 사고가 되어 다시 생기를 막는다. 목표는 무조건적 사랑을 아는 것이고, 회복은 그 결과다."},{"t":"key","x":"이 사슬 전체를 한 문장으로 줄이면 이렇다 — &quot;모든 질병은 유전자가 꺼진 상태이고, 그 유전자를 켜는 에너지는 무조건적 사랑이며, 사람이 할 일은 그 사랑이 내려앉을 기본여건을 갖추고 그것을 선택하는 것이다.&quot;"}]}],"toc":[{"id":"p1","title":"제1장 모든 질병의 뿌리 — 질병이란 무엇인가","s":[{"id":"p1-1","title":"1-1. 병 = 세포의 변질 = 유전자의 변질","key":["모든 질병은 예외 없이 유전자의 변질이다. 병명이 무엇이든 사건은 하나다."],"n":13700},{"id":"p1-2","title":"1-2. 변질이란 \"없어진 것\"이 아니라 \"꺼진 것\"이다","key":["유전자를 교체해도 소용이 없다. 껐던 사람이 다시 끄기 때문이다. 바뀌어야 하는 것은 유전자가 아니라 생각이다."],"n":7551},{"id":"p1-3","title":"1-3. 후성유전학 — 유전자는 운명이 아니다","key":[],"n":16202},{"id":"p1-4","title":"1-4. 치료(treatment)와 치유(healing)는 다르다","key":[],"n":25319},{"id":"p1-5","title":"1-5. DNA는 조립식이고, 복구 시스템이 이미 들어 있다","key":["복구 프로그램은 이미 몸 안에 다 들어 있다. 문제는 프로그램이 없는 것이 아니라 전원이 꺼져 있는 것이다."],"n":11952},{"id":"p1-6","title":"1-6. 유전자를 변질시키는 물리적 원인 — 전자파의 스펙트럼","key":[],"n":18263},{"id":"p1-7","title":"1-7. 의학에도 철학이 필요하다 — 의철학(醫哲學)의 태동","key":[],"n":5397},{"id":"p1-8","title":"1-8. 치유력은 포괄적 생명력이다 — 소화력·면역력·회복력은 그 하위 범주","key":[],"n":6057},{"id":"p1-9","title":"1-9. 변질은 어렵고 회복은 쉽다 — 산돼지와 집돼지","key":[],"n":7766},{"id":"p1-10","title":"1-10. 유전자를 결정하는 것은 바깥 환경이 아니라 내면의 환경이다","key":[],"n":12531},{"id":"p1-11","title":"1-11. 불치의 병이 아니라 불치의 인간이 있을 뿐이다","key":[],"n":4675},{"id":"p1-12","title":"1-12. 뉴스타트는 융합의학이다","key":[],"n":2522},{"id":"p1-13","title":"1-13. 원인을 묻지 않는 투병은 재발한다","key":[],"n":4701},{"id":"p1-14","title":"1-14. '성인병'에서 '생활습관병'으로 — 병은 나이가 아니라 선택이 만든다","key":[],"n":4266},{"id":"p1-15","title":"1-15. 속상하다·기가 막힌다 — 한국어에 새겨진 유전자·생기 원리","key":[],"n":22164},{"id":"p1-16","title":"1-16. 무지(無知)란 생명의 존재를 모르는 것","key":[],"n":763},{"id":"p1-17","title":"1-17. 세포 사이의 통로(간극연접)를 통한 상호부조","key":[],"n":1148},{"id":"p1-18","title":"1-18. 영어 '어덜트(adult, 성인)'의 어원은 '변질되다'이다","key":[],"n":552},{"id":"p1-19","title":"1-19. 이(理)와 기(氣) — 유전자 회복에는 힘뿐 아니라 이치가 함께 필요하다","key":[],"n":1117},{"id":"p1-20","title":"1-20. 유전자 이상의 두 유형 — 구조적 변질과 기능적 변질","key":[],"n":1047},{"id":"p1-21","title":"1-21. 내 몸은 내 것이 아니다 — 뉴스타트 강의 전체의 요약","key":[],"n":988},{"id":"p1-22","title":"1-22. 기적적 예외는 예외가 아니라 본래의 정상이다","key":[],"n":588},{"id":"p1-23","title":"1-23. 자연치유력과 자연치유물질의 구분 — 힘은 밖에서 오고 물질은 안에서 생산된다","key":[],"n":2878},{"id":"p1-24","title":"1-24. 자연치유의 「자연」은 스스로 계신 분이다 — 自然·自由와 nature 에 새겨진 창조주의 성품","key":[],"n":1651},{"id":"p1-25","title":"1-25. 원발성(原發性)·본태성(本態性) — 「원인을 모른다」는 뜻의 의학 용어","key":[],"n":616}]},{"id":"p2","title":"제2장 유전자의 스위치 — 메틸화와 탈메틸화","s":[{"id":"p2-1","title":"2-1. 스위치가 있는 자리 — 염색체·히스톤·메틸기","key":[],"n":10014},{"id":"p2-2","title":"2-2. 메틸기는 안테나다 — 스스로 움직이지 않는다","key":["메틸기가 똑똑한 것이 아니다. 신호를 보내는 이가 있다. 그 신호는 어디서 오는가 — 이것이 강의 전체가 답하려는 질문이다."],"n":6139},{"id":"p2-3","title":"2-3. 유전자는 글자다 — 창조 논증","key":[],"n":16139},{"id":"p2-4","title":"2-4. 유전자 지도를 다 읽으면 한 문장이 된다","key":["I love you — 나는 너를 사랑한다. 유전자 지도 전체의 결론은 이 한 문장이다."],"n":30512},{"id":"p2-5","title":"2-5. 암세포는 매일 생기고, 매일 돌아간다","key":["암 자체는 병이 아니다. 변한 것은 암이 아니라 나다."],"n":8022},{"id":"p2-6","title":"2-6. 원죄의 유전학적 해석 — 아담의 선택이 남긴 것","key":[],"n":9972},{"id":"p2-7","title":"2-7. 유전자 조작의 한계 — 스위치의 타이밍은 초인간적 차원에서 결정된다","key":[],"n":5876},{"id":"p2-8","title":"2-8. 다윈의 자연선택과 유전자 — 진화와 적응의 구분","key":[],"n":3560},{"id":"p2-9","title":"2-9. 신비(神祕)는 신의 비밀이다 — 인간이 조절할 수 없는 차원","key":[],"n":493},{"id":"p2-10","title":"2-10. 인간은 하나님이 쓰신 편지다 — 육의 심비에 새겨진 유전자","key":[],"n":1220}]},{"id":"p3","title":"제3장 생기(生氣) — 유전자를 켜는 에너지","s":[{"id":"p3-1","title":"3-1. 왜 반드시 에너지가 필요한가","key":[],"n":16520},{"id":"p3-2","title":"3-2. 생기의 정체 ① — 진(眞)·선(善)·미(美)","key":[],"n":23586},{"id":"p3-3","title":"3-3. 생기의 정체 ② — 사랑, 그중에서도 무조건적 사랑","key":[],"n":40343},{"id":"p3-4","title":"3-4. 무조건적 사랑의 결정적 표지 — 선택의 자유","key":[],"n":16527},{"id":"p3-5","title":"3-5. 생기는 공짜다 — 조건 없이 주어진다","key":[],"n":7866},{"id":"p3-6","title":"3-6. 생기가 실재한다는 증거들","key":[],"n":13611},{"id":"p3-7","title":"3-7. 생기를 받는 네 단계","key":[],"n":8277},{"id":"p3-8","title":"3-8. 생기는 대신 줄 수 없다 — 의사와 교주 현상","key":[],"n":2368},{"id":"p3-9","title":"3-9. 공즉시색·색즉시공 — 보이지 않는 것이 참으로 있다","key":[],"n":2742},{"id":"p3-10","title":"3-10. 기(氣)의 정체 — 진리의 영으로서의 생기","key":[],"n":8680},{"id":"p3-11","title":"3-11. 냉동생물학과 나사로 증후군 — 생기는 기술로 대체되지 않는다","key":[],"n":27786},{"id":"p3-12","title":"3-12. 생명(命)은 명령이자 약속이다","key":[],"n":552},{"id":"p3-13","title":"3-13. 휴식은 믿음의 문제다 — 믿음이 성립하는 세 조건","key":[],"n":3380},{"id":"p3-14","title":"3-14. 확신이 쌓이는 원리 — 선택의 행동화와 응답","key":[],"n":5157},{"id":"p3-15","title":"3-15. 절대선의 근거 — 입장에 따라 달라지지 않는 선","key":[],"n":486},{"id":"p3-16","title":"3-16. 고린도전서 13장으로 읽는 하나님의 성품","key":[],"n":1277},{"id":"p3-17","title":"3-17. 성경이 가르치는 참된 정상 — 분노와 죽음은 비정상이다","key":[],"n":878},{"id":"p3-18","title":"3-18. 조건적 사랑이 위선과 경쟁을 낳는 구조","key":[],"n":10874},{"id":"p3-19","title":"3-19. 스트레스는 행위가 아니라 그 행위로 받은 사랑이 푼다","key":[],"n":14384},{"id":"p3-20","title":"3-20. 생명의 정의 — 없으면 죽고, 다시 주면 산다","key":[],"n":4435},{"id":"p3-21","title":"3-21. 선택권의 존중 — 강요와 간섭은 사랑이 아니다","key":[],"n":6775},{"id":"p3-22","title":"3-22. 스트레스의 세 유형 — 주는 사람, 받는 사람, 사양하는 사람","key":[],"n":935},{"id":"p3-23","title":"3-23. 불교의 자비와 대자대비 — 무조건적 사랑의 흔적","key":[],"n":2084},{"id":"p3-24","title":"3-24. 우주심(宇宙心)과 성육신 — E=mc²으로 읽는 요한복음 1장","key":[],"n":1474},{"id":"p3-25","title":"3-25. 하나님의 사랑은 기대하지 않는다 — 섭섭함의 정체","key":[],"n":3927},{"id":"p3-26","title":"3-26. 감동(感動) — 느낌과 움직임이 합쳐져야 유전자가 켜진다","key":[],"n":2503},{"id":"p3-27","title":"3-27. 용서의 두 종류 — 도덕적 용서와 생명적 용서","key":[],"n":6484},{"id":"p3-28","title":"3-28. 하나님이 창조하신 이유 — 사랑은 반드시 대상을 필요로 한다","key":[],"n":1188},{"id":"p3-29","title":"3-29. 생명의 증거 — 부패를 막는 힘","key":[],"n":3143},{"id":"p3-30","title":"3-30. 용서의 실천법 — 마음속 감옥의 명단을 리모델링하라","key":[],"n":9136},{"id":"p3-31","title":"3-31. 히브리어 '야다' — 성경이 말하는 앎과 참된 성(性)","key":[],"n":1308},{"id":"p3-32","title":"3-32. 마음을 비운다는 것의 재해석 — 조건을 비우고 은혜로 채우는 것","key":[],"n":1661},{"id":"p3-33","title":"3-33. 나의 가치는 창조주의 시선에서 온다","key":[],"n":3243},{"id":"p3-34","title":"3-34. 인공지능은 영적 차원을 침범할 수 없다","key":[],"n":1259},{"id":"p3-35","title":"3-35. 창세기 1장 2절의 「운행하시니라」 — 알을 품는 어미 새처럼 돌보시는 창조","key":[],"n":613},{"id":"p3-36","title":"3-36. 본능은 하나님이 심어 두신 능력이다","key":[],"n":7420},{"id":"p3-37","title":"3-37. 니체의 초인(超人) 사상 — 신 없이 자신을 극복하려 한 인간의 한계","key":[],"n":470},{"id":"p3-38","title":"3-38. 성경만이 '생명책'이라 불리는 이유","key":[],"n":550},{"id":"p3-39","title":"3-39. 노자와 공자도 무조건적 사랑의 음성을 들었다","key":[],"n":4723},{"id":"p3-40","title":"3-40. 죄인은 죽은 자, 의인은 산 자라는 성경의 정의","key":[],"n":640},{"id":"p3-41","title":"3-41. 봄은 하나님이 사랑을 보여 주시는 「까꿍」이다","key":[],"n":2517},{"id":"p3-42","title":"3-42. 생명은 정해진 순서대로 유전자를 켠다","key":[],"n":4321},{"id":"p3-43","title":"3-43. 사랑이 지나가는 통로가 먼저 켜진다 — 이타(利他)가 곧 자리(自利)인 유전자적 이유","key":[],"n":452},{"id":"p3-44","title":"3-44. 하나님은 유전자 스위치로 생태계의 균형까지 유지하신다","key":[],"n":3769},{"id":"p3-45","title":"3-45. 무조건적 사랑을 조건적으로 받으면 얌체가 된다","key":[],"n":962},{"id":"p3-46","title":"3-46. 생명체와 생명은 다르다 — 파괴되는 것은 그릇뿐이다","key":[],"n":1531},{"id":"p3-47","title":"3-47. 의식(意識)은 왜 존재하는가 — 물질에는 없고 변화하는 생체 전자파에 있다","key":[],"n":623},{"id":"p3-48","title":"3-48. 영감(靈感)은 영이 주는 느낌이며 그것이 곧 생기다","key":[],"n":2261},{"id":"p3-49","title":"3-49. 사랑은 초논리(超論理)다 — 논리적 사실의 노예가 되지 말라","key":[],"n":712}]},{"id":"p4","title":"제4장 뜻 → 뇌파 → 생체 전자파 → 유전자","s":[{"id":"p4-1","title":"4-1. 사슬의 전모","key":["영(성령/악령) → 뜻(의미·해석) → 뇌파 → 생체 전자파 → 메틸기 → 유전자"],"n":22597},{"id":"p4-2","title":"4-2. 뇌파의 다섯 결","key":[],"n":17752},{"id":"p4-3","title":"4-3. 뇌파를 만드는 것은 뇌가 아니라 뜻이다","key":[],"n":7302},{"id":"p4-4","title":"4-4. 뜻은 어디서 오는가 — 생각은 밖에서 들어온다","key":[],"n":13027},{"id":"p4-5","title":"4-5. 무의식 — 95%의 영토","key":["무의식이라는 말 자체가 곧 하나님이라는 말이다. 나는 사는 것이 아니라 살려지고 있다. 문제는 이 95퍼센트의 영토가 성령과 악령이 다투는 전쟁터라는 점이다. 사랑과 미움이 뒤섞여 있고, 같은 통로를 두 영이 쓴다. 그러므로 사람이 사람의 생각을 바꿔 줄 수 없다. 필요한 것은 도덕적 개선이 아니라 진리에 의한 무의식의 재점령이다."],"n":7477},{"id":"p4-6","title":"4-6. 선택(Choice) — 최종 변수","key":[],"n":33343},{"id":"p4-7","title":"4-7. 조건반사 — 유전자는 자극이 아니라 뜻에 반응한다","key":[],"n":14336},{"id":"p4-8","title":"4-8. 영적 에너지가 물리적 에너지를 지배한다","key":[],"n":24952},{"id":"p4-9","title":"4-9. 자아(自我) — 거짓나로부터의 해방","key":[],"n":34886},{"id":"p4-10","title":"4-10. 영적 에너지는 시간과 공간을 초월한다","key":[],"n":11069},{"id":"p4-11","title":"4-11. 뜻을 잃으면 생기가 끊긴다","key":[],"n":10544},{"id":"p4-12","title":"4-12. 고난의 시간을 추억으로 빚는다","key":[],"n":1832},{"id":"p4-13","title":"4-13. 오기(勇氣)는 주어지는 것이다","key":[],"n":800},{"id":"p4-14","title":"4-14. 생명파(生命波) — 사랑이 메틸기를 움직이는 힘","key":[],"n":4982},{"id":"p4-15","title":"4-15. 생명은 선택으로 오고, 사망은 강제로 온다","key":[],"n":4093},{"id":"p4-16","title":"4-16. 이성의 동의와 감성의 불신 — 성령만이 감성을 붙잡는다","key":[],"n":1242},{"id":"p4-17","title":"4-17. 기계적 뇌파 조작의 한계 — 전기충격·자기장 치료와 생기의 차이","key":[],"n":3787},{"id":"p4-18","title":"4-18. 몸서리(전율)의 전기생리학적 기전","key":[],"n":779},{"id":"p4-19","title":"4-19. 감마파 — 판단력이 마비되는 격노의 뇌파","key":[],"n":6018},{"id":"p4-20","title":"4-20. 악을 선으로 갚는 선택이 항암 유전자를 켠다","key":[],"n":1759},{"id":"p4-21","title":"4-21. 좌뇌와 우뇌의 균형이 무너지면 정서가 메마른다","key":[],"n":2399},{"id":"p4-22","title":"4-22. 잡념(雜念)은 잡뜻이다 — 강제로 들어오는 뜻과 존중하는 뜻","key":[],"n":2952},{"id":"p4-23","title":"4-23. 우리의 싸움은 자신과의 싸움이 아니라 생기와 사기의 싸움이다","key":[],"n":2204},{"id":"p4-24","title":"4-24. 감동의 단계와 유전자 활성화 비율","key":[],"n":4650},{"id":"p4-25","title":"4-25. 배구 선수가 되라 — 스트레스는 받는 즉시 넘긴다","key":[],"n":1966},{"id":"p4-26","title":"4-26. 찬양과 상상이 부르는 세로토닌·멜라토닌","key":[],"n":8705},{"id":"p4-27","title":"4-27. 무조건 살고 싶다는 마음은 성령의 음성이다","key":[],"n":4840},{"id":"p4-28","title":"4-28. 스트레스 무역 — 관계 속에서 스트레스를 주고받는 심리","key":[],"n":2736},{"id":"p4-29","title":"4-29. 쑥(수줍음·부끄러움)은 악령의 최고 무기다","key":[],"n":22605},{"id":"p4-30","title":"4-30. 자기비하와 자기혐오는 악령이 심어 주는 생각이다","key":[],"n":4621},{"id":"p4-31","title":"4-31. 중독은 영적 존재가 도파민 유전자를 조작해 만드는 현상이다","key":[],"n":3600},{"id":"p4-32","title":"4-32. 타인의 말 한마디가 환자의 유전자 발현에 직접 영향을 준다","key":[],"n":10986},{"id":"p4-33","title":"4-33. 성령을 선택하는 것과 악령을 거부하는 것은 동시에 일어나는 하나의 행동","key":[],"n":1851},{"id":"p4-34","title":"4-34. 무조건적 사랑의 유산은 죽음 이후에도 남는다","key":[],"n":672},{"id":"p4-35","title":"4-35. 짜고 치는 고스톱 — 잡신의 「작전상 후퇴」","key":[],"n":1826},{"id":"p4-36","title":"4-36. 악령은 직접 흔들지 못할 때 가족을 통해 에둘러 공격한다","key":[],"n":1776},{"id":"p4-37","title":"4-37. 악령은 쓸 만한 사람을 골라 공격한다","key":[],"n":1313},{"id":"p4-38","title":"4-38. 먼저 져 주는 쪽이 영적 승리자다 — 육적 패배와 영적 승리의 구분","key":[],"n":3861},{"id":"p4-39","title":"4-39. 집단 무의식 — 두려움은 민족 단위로 유전된다","key":[],"n":3190},{"id":"p4-40","title":"4-40. 오해(誤解)는 유전자를 끄는 가장 흔한 통로다","key":[],"n":4105},{"id":"p4-41","title":"4-41. 약한 물리적 에너지는 강한 물리적 에너지의 지배를 받는다 — 전파 방해의 원리","key":[],"n":572},{"id":"p4-42","title":"4-42. 부분적 비합리성은 영적 지배를 알아보는 표지다 — 한 영역에서만 합리가 통하지 않을 때","key":[],"n":1479},{"id":"p4-43","title":"4-43. 이심전심 — 마음은 직접 통하지 않고 하나님을 거쳐 전해진다","key":[],"n":1586},{"id":"p4-44","title":"4-44. 「아하!」의 순간 — 이해와 깨달음은 다르고, 깨달음의 자리에 생기가 들어온다","key":[],"n":1617}]},{"id":"p5","title":"제5장 기본여건과 뉴스타트 8대 원칙","s":[{"id":"p5-1","title":"5-1. 생기는 공짜지만 아무 자리에나 내려앉지 않는다","key":["뉴스타트는 생기를 만들어 내는 기술이 아니다. 생기가 내려앉을 자리를 마련해 드리는 일이다."],"n":390},{"id":"p5-2","title":"5-2. 콩나물이 되느냐 콩나무가 되느냐","key":["이 원리의 출발점은 강사의 유년기 기억이다. 1943년에 태어난 그는 1950년 6·25가 났을 때 만 일곱 살이었다. 먹을 것이 귀하던 1948~49년 무렵 프라이팬에 콩을 볶아 간식으로 먹었고, 콩을 모아 엿장수에게 주고 엿가락으로 바꿔 먹기도 했다. 그래서 호주머니에도 책상 서랍에도 온돌방 바닥에도 콩이 굴러다녔다. 그런데 같은 콩이라도 그런 자리에 놓아두면 일 년이 지나도 삼 년이 지나도 싹이 트지 않고 썩지도 않다가, 흙에 살짝 심고 물만 주면 곧 싹이 텄다. 어린 상구는 콩이 자기가 지금 책상 위에 있는지 호주머니 속에 있는지 흙 속에 있는지를 아는 것처럼 보여, 콩이 참 똑똑하다고 여겼다. 그러나 콩에게 지능이 있을 리 없다. 콩이 여기는 땅이니 뿌리를 내리자고 아는 것이 아니라, 그 콩이 땅에 심겼다는 것을 아시는 분이 아시고 그때부터 생기를 보내시는 것이다."],"n":1099},{"id":"p5-3","title":"5-3. NEWSTART — 여덟 글자의 위계","key":[],"n":30921},{"id":"p5-4","title":"5-4. 체온 36.5도 — 사람의 38도","key":[],"n":8559},{"id":"p5-5","title":"5-5. 절제와 우상 — 좋다는 것 하나에 몰리지 말라","key":["병을 고치는 특별한 음식은 존재하지 않는다. 음식이 주인공이 아니라 생기가 뉴스타트의 주인공이며, &quot;무엇을 드셨습니까&quot;라는 질문 자체가 이미 우상숭배의 흔적이다. 강의는 음식이나 건강식품으로 병을 고치려는 태도를 성경적 의미의 우상숭배로 규정한다. 생명을 대신해 다른 무엇에 의지하는 것 자체가 우상이며, 그 우상이 반드시 불상이나 미신적 형태를 띨 필요는 없고 녹즙이든 알약이든 몸에 좋다는 음식이든 생명에 대한 관심을 대체하면 곧 우상이 된다. 우상숭배를 하지 말라는 계명을 유치하게 해석해 타 종교인만 비난하면서 정작 건강식품에 매달리는 것도 같은 우상숭배라고 지적한다."],"n":23411},{"id":"p5-6","title":"5-6. 당기게 하시는 하나님 — NPY 유전자","key":[],"n":11215},{"id":"p5-7","title":"5-7. 왜 식물성 음식 위주인가 — 두 가지 이유","key":[],"n":25120},{"id":"p5-8","title":"5-8. 운동 — 스트레칭·심호흡·모세혈관","key":[],"n":29536},{"id":"p5-9","title":"5-9. 뉴스타트 식생활은 율법이 아니다 — 당김의 두 근원","key":[],"n":16569},{"id":"p5-10","title":"5-10. 스트레스 — 산소를 끊어 생기의 통로를 막는다","key":[],"n":7379},{"id":"p5-11","title":"5-11. 자주 묻는 것들 — 계란, 단백질, 맨발 걷기","key":[],"n":10765},{"id":"p5-12","title":"5-12. 기절 — 생기 차단에 대한 몸의 방어 반응","key":[],"n":3401},{"id":"p5-13","title":"5-13. 영양소 균형 — 탄수화물·단백질·지방과 활성산소 저항력","key":[],"n":9997},{"id":"p5-14","title":"5-14. 절제의 원칙 — 운동도 과하면 병이 된다","key":[],"n":15968},{"id":"p5-15","title":"5-15. 암세포를 죽인다는 식품 — 자연 항암물질과 그 위험","key":[],"n":7060},{"id":"p5-16","title":"5-16. 모성본능 유전자는 사랑으로 켜진다","key":[],"n":5089},{"id":"p5-17","title":"5-17. 식이요법의 한계 — 가짜 치유담의 착시와 영적 미끼","key":[],"n":11395},{"id":"p5-18","title":"5-18. 스트레스의 뿌리는 조건적 사랑(욕심)이다","key":[],"n":12133},{"id":"p5-19","title":"5-19. 짠 음식·매운 음식과 나트륨–수분의 균형","key":[],"n":2506},{"id":"p5-20","title":"5-20. 야식과 간식이 유전자 회복을 방해한다","key":[],"n":5025},{"id":"p5-21","title":"5-21. 정상이 변질된 사회 — 별나게 살아야 건강하다","key":[],"n":3841},{"id":"p5-22","title":"5-22. 필요 이상의 앎은 병이 된다 — 정보 과잉의 역설","key":[],"n":1147},{"id":"p5-23","title":"5-23. 정결한 물고기의 원칙 — 지느러미와 비늘","key":[],"n":8342},{"id":"p5-24","title":"5-24. 유전자의 하루 리듬 — 아침은 충분히, 저녁은 가볍게","key":[],"n":677},{"id":"p5-25","title":"5-25. 장내세균(마이크로바이옴)의 균형","key":[],"n":8835},{"id":"p5-26","title":"5-26. 조미료 대체의 원칙 — 된장·고추장, 식초, 설탕","key":[],"n":2585},{"id":"p5-27","title":"5-27. 뉴스타트 조리법 실무 — 현미밥·대체 조미료·기름 줄이기·껍질째 먹기","key":[],"n":20990},{"id":"p5-28","title":"5-28. 씨 뿌리는 자의 비유로 본 재발의 원리 — 개념을 놓치면 되돌아간다","key":[],"n":1127},{"id":"p5-29","title":"5-29. 절제는 자유의 박탈이 아니라 자유의 회복이다","key":[],"n":2628},{"id":"p5-30","title":"5-30. 내면적 휴식과 외부적 휴식의 구분","key":[],"n":3091},{"id":"p5-31","title":"5-31. 안식일 — 이레마다 돌아오는 휴식의 리듬","key":[],"n":821},{"id":"p5-32","title":"5-32. 인삼의 카테콜아민 — 같은 약재에 사람마다 다르게 반응하는 이유","key":[],"n":776},{"id":"p5-33","title":"5-33. 절제로 재편되는 유전자 — 쓰지 않으면 다시 잠긴다","key":[],"n":570},{"id":"p5-34","title":"5-34. 나이 들며 변질되는 생명유지 본능","key":[],"n":1138},{"id":"p5-35","title":"5-35. 우유와 골다공증 — 칼슘 흡수의 조건은 운동이다","key":[],"n":1286},{"id":"p5-36","title":"5-36. 완전단백질의 원리 — 쌀과 콩의 상호보완","key":[],"n":2995},{"id":"p5-37","title":"5-37. 저탄수화물·고단백 식단의 장기적 위험","key":[],"n":2960},{"id":"p5-38","title":"5-38. 물은 사랑이다 — 상선약수와 생명수","key":[],"n":3475},{"id":"p5-39","title":"5-39. 몸이 당기는 음식 — 필요를 채우시는 인도","key":["우리가 인위적으로 짜야 하는 식단표는 없다. 당기게 하시는 대로 먹되 절제한다. 다만 폭식이 아니라 필요한 만큼만이다. 밥상에서 밥과 반찬을 뜰 때 이미 &quot;이번 끼니는 이 정도면 딱 맞겠다&quot;고 판단하는 그 양이 곧 정해 주시는 양이며, 식사 때마다 자신도 모르게 밥을 뜨는 양이 달라지는 것은 그날그날 필요한 에너지에 맞춰 식욕을 조절해 주시기 때문이다. 평소 안 먹던 음식이 갑자기 당기면 죄책감 없이 적당히 받아들이고, 당기지 않는 것을 &quot;좋다니까&quot; 억지로 밀어 넣지 않는다. 인도하시는 것은 무엇을 먹느냐에 그치지 않고 얼마나 먹느냐에까지 미친다. 밥을 뜨는 순간 이미 너무 많은 것 같다는 마음이 스치는데, 그것을 무시하고 다 먹고 나면 얹히고 체한다. 그 체함은 꾸짖음이 아니라 내 말이 맞지 않더냐는 확인이다. 만두를 여덟 개 먹고 싶어 세 개를 뜬 뒤 네 개째를 뜨려 할 때 참으라는 음성이 오고, 네 개까지만 먹겠다고 하고 담고 나면 또 한 개를 더 담고 싶어져 조심하라는 음성이 다시 온다. 다섯 개를 먹고 나서 네 개만 먹었으면 좋았겠다고 하면 그렇다는 대답이 돌아올 뿐, 앞으로 혼내 주겠다는 말은 나오지 않는다. 무시하는 일이 되풀이되어도 사랑은 오래 참고 모든 것을 믿으므로 그 자리에서 화를 내지 않고 언젠가 믿게 될 것을 기다린다. 하나님을 혼내는 존재로만 생각하는 것이 종교적 하나님이고, 생명의 하나님은 그렇지 않다. 무엇을 얼마나 먹어야 하는지는 그때그때 내 상태를 나보다 더 잘 아시는 분이 당김과 절제로 알려 주시는 것이며, 그 음성을 알아듣는 것이 절제다. 그러므로 식생활은 규칙표를 지키는 일이 아니라 내 입맛을 조절해 주시는 분이 계시다는 믿음으로 하는 일이다."],"n":14975},{"id":"p5-40","title":"5-40. 미각의 변질 — 해로운 것을 싫어하도록 태어난 몸","key":[],"n":2069},{"id":"p5-41","title":"5-41. 간장·된장 제조 과정에서 생기는 발암물질","key":[],"n":1876},{"id":"p5-42","title":"5-42. 약은 급격히 끊지 않는다 — 회복되는 만큼 점진적으로 줄인다","key":[],"n":619},{"id":"p5-43","title":"5-43. 값진 성분일수록 하나님은 흔하고 값싸게 주신다","key":[],"n":11446},{"id":"p5-44","title":"5-44. 렙틴 유전자와 체중 조절","key":[],"n":3093},{"id":"p5-45","title":"5-45. 복(福)은 생기(生氣)다","key":[],"n":851},{"id":"p5-46","title":"5-46. 뉴스타트는 거짓 나에서 참 나로 돌아가는 정신 차림의 과정이다","key":[],"n":1250},{"id":"p5-47","title":"5-47. 무정란 비유로 본 하나님의 정확한 돌봄","key":[],"n":7476},{"id":"p5-48","title":"5-48. 음식에 대한 갈망도 하나님의 인도와 악령의 유혹으로 갈린다","key":[],"n":2277},{"id":"p5-49","title":"5-49. 채소의 질산염과 해물의 아민이 만나 발암물질이 된다","key":[],"n":1516},{"id":"p5-50","title":"5-50. 만병의 뿌리 — 생명·공기·물의 삼중 결핍","key":[],"n":1903},{"id":"p5-51","title":"5-51. 체질 운명론 — 사상체질이 성립하지 않는 이유","key":[],"n":2270},{"id":"p5-52","title":"5-52. 「철저하게」가 유전자를 끈다 — 완벽주의는 긴장상태의 다른 이름이다","key":[],"n":4192}]},{"id":"p6","title":"제6장 활성산소·SOD·항산화 물질","s":[{"id":"p6-1","title":"6-1. 살아 있다는 것 자체가 활성산소를 만든다","key":[],"n":296},{"id":"p6-2","title":"6-2. 활성산소가 하는 세 가지 손상","key":["건강을 해치는 가장 나쁜 물질을 하나만 대라면 답은 활성산소다."],"n":136},{"id":"p6-3","title":"6-3. 첫 번째 방어선 — SOD","key":["세상의 모든 항산화 알약을 늘어놓아도, 최고의 항산화 물질은 이미 내 세포 안에서 SOD로 생산되고 있다. 공장은 이미 있다. 문제는 스위치다."],"n":824},{"id":"p6-4","title":"6-4. 두 번째 방어선 — 식물의 색소","key":["아름다움을 먹는다 — 사과 한 알을 먹을 때 색소(물질)와 생기(영)가 동시에 들어온다. 그러니 &quot;와, 색깔 좋다&quot; 하고 감탄하며 먹으라. 귤 하나를 까면서도 색을 보고 향기를 맡고 모양을 살피고 맛을 소리 내어 말하라. 산화방지 물질은 비타민C와 비타민E를 빼면 거의 모두가 식물의 색소이며, 딸기의 빨간색과 토마토의 빨간색이 같은 물질이고 잎사귀의 초록도, 포도·자두·블루베리의 군청색도, 호박·당근·고구마의 색을 내는 베타카로틴도 모두 산화방지 물질이다. 그런데 이 색소들은 먹혀서 몸 안에 들어간 뒤에만 일하는 것이 아니다. 하나님은 거기서 한 걸음 더 나아가 그 색소에 예쁜 색을 입혀 우리를 꾀신다. 색이 예쁘지 않으면 당기지 않기 때문이다. 보기에 아름다운 색이어서 &quot;색깔 좋다&quot;고 느끼는 그 순간에 이미 유전자가 켜지고, 향기도 마찬가지로 유전자를 켠다. 귤은 껍질의 촉감이 좋고, 깔 때 물방울이 톡톡 튀고, 향기가 난다. 그 색과 향과 촉감이 이미 생기를 받게 하고, 그러면서 산화방지 물질까지 먹게 된다. 하나님은 물질만 먹으라 하신 것이 아니라 마음도 먹으라 하셨고, 그래서 우리말에 &quot;마음먹는다&quot;는 말이 있다. 색과 향과 맛으로 먼저 유전자를 켜고 그다음에 성분이 들어가도록 이중으로 마련해 두신 것이다. 알약에는 예쁜 색도 향기도 없으므로 베타카로틴을 알약 하나로 대신하면 물질은 들어가되 유전자에는 큰 도움이 되지 않으며, 갈아서 주스로 만들어 한 잔 들이켜고 끝내는 것도 마찬가지다. 여보 이거 하나 먹어 보라며 건네고 받는 그 장면까지가 하나님이 세워 둔 작전이다. 강의가 뉴스타트 센터의 옥수수를 예로 드는데, 한 자루 안에 알의 색이 여러 가지인 것은 산화방지 물질의 종류를 고루 섭취하게 하려는 뜻이다."],"n":34535},{"id":"p6-5","title":"6-5. 만성적인 산소 부족이 피를 끈적하게 만들어 세포를 변질시킨다","key":[],"n":4778},{"id":"p6-6","title":"6-6. 미토콘드리아의 연소에는 점화가 필요하다 — 교과서 그림에서 빠진 스파크","key":[],"n":4834}]},{"id":"p7","title":"제7장 정신(精神) — 정신님과 잡신","s":[{"id":"p7-1","title":"7-1. '정신'은 의식이 아니라 신(神)의 이름이다","key":[],"n":445},{"id":"p7-2","title":"7-2. 靈(영) 자의 파자","key":[],"n":26633},{"id":"p7-3","title":"7-3. 모든 명령은 사실 약속이다","key":[],"n":11850},{"id":"p7-4","title":"7-4. 조건적 하나님이 만드는 병","key":[],"n":9524},{"id":"p7-5","title":"7-5. 완전해지지 않아도 된다","key":[],"n":3139},{"id":"p7-6","title":"7-6. 적그리스도의 정체 — 스스로 완전해져 구원받는다는 생각","key":[],"n":1138},{"id":"p7-7","title":"7-7. 한자에 새겨진 성경 — 船·善·神의 파자","key":[],"n":7208},{"id":"p7-8","title":"7-8. 로마서 7:24 — 성령의 온유한 자기직면","key":[],"n":1920},{"id":"p7-9","title":"7-9. 성경은 도덕책이 아니다 — 그리고 '하나님'이라는 이름","key":[],"n":3399},{"id":"p7-10","title":"7-10. 용서할 수 없는 인간과 대속의 약속","key":[],"n":6329},{"id":"p7-11","title":"7-11. 인간을 섬기시는 하나님 — 인자(人子)와 섬기는 지도자상","key":[],"n":5419},{"id":"p7-12","title":"7-12. 말이 나오지 않아도 기도의 자세는 기도다","key":[],"n":4606},{"id":"p7-13","title":"7-13. 예수의 이름으로 기도한다는 것의 뜻","key":[],"n":762},{"id":"p7-14","title":"7-14. 하나님의 진노 — 조건적 진노와 무조건적 진노","key":[],"n":4598},{"id":"p7-15","title":"7-15. 말라기의 십일조 본문 — 명령이 아니라 초청","key":[],"n":2368},{"id":"p7-16","title":"7-16. 진리의 종교화 — 기복신앙에 대한 비판","key":[],"n":7419},{"id":"p7-17","title":"7-17. 히브리 결혼 제도로 본 하나님과 신자의 관계 — 정혼과 신부값","key":[],"n":1425},{"id":"p7-18","title":"7-18. 생명 에너지와 영혼 개념의 구분 — 빙의는 악령의 기만이다","key":[],"n":1116},{"id":"p7-19","title":"7-19. 좁은 문 — 고행이 아니라 한계를 지킬 때 오는 자유","key":[],"n":899},{"id":"p7-20","title":"7-20. 믿음의 의로움 — 지사와 본사의 시민권 비유","key":[],"n":7852},{"id":"p7-21","title":"7-21. 성경은 법률문서가 아니라 사랑의 기록이다","key":[],"n":2118},{"id":"p7-22","title":"7-22. 회개의 두 종류 — 조건적 회개와 감사의 회개","key":[],"n":2882},{"id":"p7-23","title":"7-23. 믿음이 없으면 믿음을 주신다 — 열 문둥병자의 비유","key":[],"n":4992},{"id":"p7-24","title":"7-24. 인간관계의 스트레스는 영적 씨름이다","key":[],"n":1028},{"id":"p7-25","title":"7-25. 하나님이 우리를 섬기신다 — 소화효소 유전자의 예","key":[],"n":4606},{"id":"p7-26","title":"7-26. 온전한 십일조란 온전한 기쁨을 말한다","key":[],"n":1616},{"id":"p7-27","title":"7-27. '심령이 가난한 자'의 재해석 — 겸손이 아니라 사랑이 넘치는 마음","key":[],"n":1576},{"id":"p7-28","title":"7-28. 성령의 증거 — 자녀가 '될 것'이 아니라 이미 자녀'인 것'","key":[],"n":3098},{"id":"p7-29","title":"7-29. 사단의 청구권 — 확신이 흔들릴 때마다 다시 시험이 온다","key":[],"n":2188},{"id":"p7-30","title":"7-30. 죽음과 부활 사이의 '없는 시간'","key":[],"n":832},{"id":"p7-31","title":"7-31. 꿈의 정체 — 잡신의 장난과 신앙적 분별","key":[],"n":2961},{"id":"p7-32","title":"7-32. 성경적 '복'의 재정의 — 생육하고 번성함","key":[],"n":2167},{"id":"p7-33","title":"7-33. 생각(生覺)과 사각(死覺) — 살리는 생각과 죽이는 생각","key":[],"n":801},{"id":"p7-34","title":"7-34. 번데기와 나비 — 변화의 비유","key":[],"n":3526},{"id":"p7-35","title":"7-35. 목적지는 이미 정해져 있다 — 바다거북의 섭리","key":[],"n":4723},{"id":"p7-36","title":"7-36. 한자 靈(신령 령)에 새겨진 성령의 성질","key":[],"n":1020},{"id":"p7-37","title":"7-37. 해탈·견성·거듭남 — 종교마다 다른 이름의 같은 경험","key":[],"n":4739},{"id":"p7-38","title":"7-38. 아사셀 염소 재해석 — 죄를 없애는 이는 누구인가","key":[],"n":607},{"id":"p7-39","title":"7-39. 썩는 씨와 썩지 않는 씨 — 창조의 다양성","key":[],"n":1965},{"id":"p7-40","title":"7-40. 천사들 사이의 우주적 논쟁과 창세전에 예정된 십자가","key":[],"n":3780},{"id":"p7-41","title":"7-41. 공동체 안의 다툼은 부추겨진 것이다 — 화평케 하는 자의 부르심","key":[],"n":2993},{"id":"p7-42","title":"7-42. 구원은 안식일 준수로 결정되지 않는다 — 이미 완불된 것을 믿는 믿음","key":[],"n":3944},{"id":"p7-43","title":"7-43. 인본주의와 제도만으로는 인간의 죄성을 넘지 못한다","key":[],"n":739},{"id":"p7-44","title":"7-44. 눈은 몸의 등불이다 — 보는 것이 유전자를 켠다","key":[],"n":2284},{"id":"p7-45","title":"7-45. 무법천지·율법·사랑 — 구원사의 세 단계","key":[],"n":4485},{"id":"p7-46","title":"7-46. 포기는 폐기이다 — 소유권과 재건축의 논리","key":[],"n":792},{"id":"p7-47","title":"7-47. 우상숭배 금지의 재해석 — 생기보다 중요한 것을 추구하지 말라","key":[],"n":4315},{"id":"p7-48","title":"7-48. 치유는 둘째 문제다 — 낫지 않을 때 악령이 벌이는 작전","key":[],"n":1977},{"id":"p7-49","title":"7-49. 누가복음 16장 부자와 나사로 비유의 재해석","key":[],"n":671},{"id":"p7-50","title":"7-50. 지옥은 악령을 받아들인 인간의 마음속에 있다","key":[],"n":2546},{"id":"p7-51","title":"7-51. 하나님이 안 보인다고 없는 것이 아니다 — 보이지 않는 것의 합리성","key":[],"n":2341},{"id":"p7-52","title":"7-52. 뉴스타트는 종교가 아니라 진리다","key":[],"n":2213},{"id":"p7-53","title":"7-53. 인자(人子)라는 칭호에 담긴 하나님과 인간의 눈높이","key":[],"n":597},{"id":"p7-54","title":"7-54. 빛과 어둠 — 진리가 자유케 하는 유일한 길","key":[],"n":1717},{"id":"p7-55","title":"7-55. 사단이 무조건적 사랑을 거부한 이유 — 「기어오름」에 대한 두려움","key":[],"n":1253},{"id":"p7-56","title":"7-56. 선악 이원론 비판 — 도덕경과 「네 눈 속의 들보」로 본 상호 정죄의 구조","key":[],"n":757},{"id":"p7-57","title":"7-57. 인간의 의와 하나님의 의 — 병을 만드는 의, 병을 낫게 하는 의","key":[],"n":3110},{"id":"p7-58","title":"7-58. 복음이란 나 자신에 대한 새로운 인식이다","key":[],"n":1871},{"id":"p7-59","title":"7-59. 하나님은 우리의 쓰레기통이 되어 주신다","key":[],"n":632},{"id":"p7-60","title":"7-60. 어리광 신앙 — 격식보다 친밀함이 유전자를 켠다","key":[],"n":3882},{"id":"p7-61","title":"7-61. 지구 종말론·화성 이주론과 성경의 새 하늘 새 땅","key":[],"n":2117},{"id":"p7-62","title":"7-62. 신앙은 중개자를 거치지 않고 하나님과 직접 소통하는 것이다","key":[],"n":336},{"id":"p7-63","title":"7-63. 하나님의 이름을 경외한다는 것은 두려움이 아니라 감격이다","key":[],"n":311},{"id":"p7-64","title":"7-64. 구약과 신약은 하나님이 하신 두 가지 「약속」이다","key":[],"n":1844},{"id":"p7-65","title":"7-65. 인간은 우주 통일의 동역자다","key":[],"n":667},{"id":"p7-66","title":"7-66. 성령을 훼방하는 죄가 사함받지 못하는 이유 — 용서가 없어서가 아니라 용서를 거부하기 때문이다","key":[],"n":1484},{"id":"p7-67","title":"7-67. 아담은 오실 자의 표상이다 — 선악과 사건에 새겨진 십자가의 사랑","key":[],"n":1206},{"id":"p7-68","title":"7-68. 예배는 바치는 행사가 아니라 받는 행사다","key":[],"n":554},{"id":"p7-69","title":"7-69. 조건적 사고방식은 유전자에 배어 있어 재창조로만 씻긴다","key":[],"n":2664},{"id":"p7-70","title":"7-70. 선입견의 할례 — 진리가 자유케 한다는 말의 뜻","key":[],"n":1241}]},{"id":"p8","title":"제8장 사실(Fact)과 진실(Truth)","s":[{"id":"p8-1","title":"8-1. 두 단어를 가르는 기준","key":["유전자는 사실에 반응하지 않는다. 오직 진실에만 반응한다. 생기가 없으면 아직 진실이 아니다."],"n":17338},{"id":"p8-2","title":"8-2. 사실의 인생이 도달하는 결론","key":["이것은 거짓말의 정당화가 아니라 판단 기준의 전환이다. 정확성이 아니라 생명이 기준이 된다."],"n":4099},{"id":"p8-3","title":"8-3. 죽음도 사실일 뿐 진실이 아니다","key":["이 지구상에 존재하는 사실이 곧 진실은 아니다. 모든 사람이 죽는다는 것은 사실이지만, 영원한 생명을 누리도록 되어 있다는 것이 진실이다. 구원이란 사실로부터 해방되어 진실을 깨닫는 것이다."],"n":12657},{"id":"p8-4","title":"8-4. 자기분열과 자기통일","key":[],"n":10098},{"id":"p8-5","title":"8-5. 긍정적 사고의 근거 — 이미 얻은 구원의 확신","key":[],"n":13416},{"id":"p8-6","title":"8-6. 모든 일은 지나가기 위해 온다 — 과거를 붙잡지 않는 삶","key":[],"n":3023},{"id":"p8-7","title":"8-7. 바늘로 코끼리를 죽이는 법 — 절망에는 반드시 반대편이 있다","key":[],"n":934},{"id":"p8-8","title":"8-8. 현대인의 다양한 염려증 — 스스로 만들어 낸 걱정","key":[],"n":1974},{"id":"p8-9","title":"8-9. 아는 것이 힘이다 — 진리를 아는 것이 곧 유전자를 켜는 힘이다","key":[],"n":6637},{"id":"p8-10","title":"8-10. 거짓 믿음도 일시적으로 유전자를 켠다 — 참된 치유와의 구분","key":[],"n":9189},{"id":"p8-11","title":"8-11. 과학 논문은 사랑이라는 말을 낯선 전문용어로 바꾸어야 인정받는다","key":[],"n":478},{"id":"p8-12","title":"8-12. 성령이 주시는 참 믿음과 악령이 두려움으로 심는 거짓 믿음","key":[],"n":1943},{"id":"p8-13","title":"8-13. 십자가의 「다 이루었다」는 회계 용어로 「완불」이다","key":[],"n":3056},{"id":"p8-14","title":"8-14. 「배 째라」 — 악령의 협박을 무력화하는 마지막 선택","key":[],"n":2636},{"id":"p8-15","title":"8-15. 죽고 싶을 때 내릴 결정은 취소가 아니라 보류다","key":[],"n":2233}]},{"id":"p9","title":"제9장 행복과 쾌락 — 여섯 가지 행복 유전자","s":[{"id":"p9-1","title":"9-1. 행복은 감정이 아니라 물질의 생산이다","key":[],"n":16187},{"id":"p9-2","title":"9-2. 행복과 쾌락은 다르다","key":["사랑이 빠져 있을 때는 그것을 행복이라 부르는 것이 아니라 쾌락이라 부른다. 행복이란 의미가 있을 때 느끼는 것이다. 쾌락은 자기 욕구를 자기가 원하는 대로 만족시키는 일이어서 다른 사람과 상관이 없고, 그 안에는 무조건적 사랑이 들어설 자리가 없다. 게다가 쾌락은 건강을 희생시킨다. 술이 몸에 나쁘다는 것을 알면서도 마시는 순간 건강보다 쾌락을 위에 놓은 것이며, 그런 상태에서는 생기를 받을 수 없다."],"n":2975},{"id":"p9-3","title":"9-3. 근거 — T세포의 두 반응과 수녀 연구","key":[],"n":7446},{"id":"p9-4","title":"9-4. 투병 중인 사람에게","key":[],"n":2002},{"id":"p9-5","title":"9-5. 두려움의 정체 — 뇌파를 지배해 판단을 마비시킨다","key":[],"n":7571},{"id":"p9-6","title":"9-6. 의미 있는 시간이 곧 치유의 시간이다","key":[],"n":8205},{"id":"p9-7","title":"9-7. 낫는 것보다 행복한 것에 초점을 맞추라","key":[],"n":2059},{"id":"p9-8","title":"9-8. 상대적 행복과 절대적 행복","key":[],"n":14175}]},{"id":"p10","title":"제10장 장수 — 텔로미어·텔로머라제·신앙","s":[{"id":"p10-1","title":"10-1. 수명을 재는 눈금 — 텔로미어","key":["텔로미어는 세월을 재는 자가 아니라 마음을 재는 자다."],"n":293},{"id":"p10-2","title":"10-2. 되돌리는 효소 — 텔로머라제","key":["장수는 병 나은 뒤에 따라오는 보너스가 아니다. 암 유전자를 켜던 그 힘과 텔로머라제 유전자를 켜는 힘이 똑같은 하나의 생기다. 뉴스타트를 하는 사람에게 장수는 요행이 아니라 당연한 결과이며, 상급이 아니라 이치다. 하나님이 채점해서 주시는 것이 아니다. 오래 사는 사람이란 텔로머라제를 잘 만드는 사람이고, 텔로머라제를 잘 만드는 사람이란 그것을 만드는 유전자가 잘 켜지는 사람이며, 그 유전자가 잘 켜지는 사람이란 결국 뉴스타트를 하는 사람이라는 것이 강사가 밟아 가는 결론의 순서다. 유전자를 켜는 것은 뜻이고 생기이므로 장수는 주어지는 것이 아니라 선택되는 것이다. 지금 세포를 떼어 텔로미어 길이를 재면 앞으로 얼마나 살지를 알 수 있는데, 그 숫자가 기분 나쁜 사람은 뉴스타트로 길이를 늘리면 된다."],"n":9016},{"id":"p10-3","title":"10-3. 장수 요인의 순위가 다섯 번 뒤집혔다","key":["이 연구들이 물은 것은 오직 예배 출석 빈도 한 가지였다. 조사자가 참여자를 앉혀 놓고 하나님을 참으로 아는지 가려낼 수 없었고 그것은 개인의 프라이버시에 속하는 물음이기도 했으므로, 「매주 집회에 참석합니까」라는 문항 하나로 신앙 집단이 묶였다. 그 결과 체면상 예배에 나와 설교 시간에 졸다 가는 이른바 나이롱 신자(성경이 말하는 가라지)가 표본에 그대로 섞여 들어갔고, 강의는 그 비율을 넷 중 셋 또는 3분의 2쯤으로 어림한다. 그러므로 46퍼센트, 25퍼센트, 7년이라는 숫자는 형식적 신자를 잔뜩 섞고도 나온 값이며, 통계가 보여 준 것은 최댓값이 아니라 최솟값이다."],"n":12216},{"id":"p10-4","title":"10-4. 친밀함(intimacy)의 치유력","key":[],"n":6999},{"id":"p10-5","title":"10-5. 나이가 들어도 마음속에는 아이가 남아 있다","key":[],"n":829},{"id":"p10-6","title":"10-6. 인생의 사계절 — 결실과 쉼으로 다시 읽는 은퇴","key":[],"n":2785},{"id":"p10-7","title":"10-7. 영생은 심판의 결과가 아니라 이미 옮겨진 생명이다","key":[],"n":2627},{"id":"p10-8","title":"10-8. 마음의 운동 — 장수는 힘을 들여 사는 것이다","key":[],"n":3093},{"id":"p10-9","title":"10-9. 늙어서 죽는 것이 아니라 사명을 마치고 부름받는 것이다","key":[],"n":3778}]},{"id":"p11","title":"제11장 관찰자 — 하나님의 의학과 인간의 의학","s":[{"id":"p11-1","title":"11-1. \"저절로\"가 성립하지 않는 자리들","key":["과학자들은 연어가 물 냄새를 기억한다거나 거북에게 자기장을 읽는 내비게이션 같은 기능이 있다는 식으로 설명한다. 그러나 어미가 알을 낳고 곧바로 죽는 연어의 새끼는 그 경로를 한 번도 지나 본 일이 없으므로 기억할 것이 없고, 수십 년 만에 돌아오는 거북의 기억을 어떻게 증명할 것인가도 남는다. 무엇보다 내비게이션이 있다고 아무 데나 갈 수 있는 것이 아니어서, 목적지를 알고 그 주소를 입력해야 갈 수 있는데 새끼 거북은 자기가 가야 할 곳의 이름도 존재도 모른다 (→ <a href=\"#/s/p3-36\">1부 3-36<\/a> 참조). 이런 설명들은 결국 그 동물에게 그런 능력이 있다고 말을 바꾸어 놓은 것일 뿐이며, 남는 설명은 목적지를 아는 이가 따로 있어 인도하신다는 것 하나다."],"n":1241},{"id":"p11-2","title":"11-2. 과학이 이름 붙인 것 — 우주의식과 관찰자","key":["강의의 핵심 경고 — 관찰자 자리에 인간을 앉히는 순간 신앙은 주술이 된다. &quot;끌어당김의 법칙&quot;이 그것이다. 기도와 뉴스타트는 소원을 관철시키는 기술이 아니라 하나님의 뜻과 맞추는 자리다."],"n":17528},{"id":"p11-3","title":"11-3. 심리면역학에서 신학생물학으로","key":[],"n":9735},{"id":"p11-4","title":"11-4. 정당성의 원리 — 왜 항암제는 내성이 생기는가","key":[],"n":23660},{"id":"p11-5","title":"11-5. 인간의 의학이 부딪히는 벽 — 이식과 면역억제제","key":[],"n":9111},{"id":"p11-6","title":"11-6. AI와 최신 연구 — 관찰자를 빼놓은 과학","key":["생명은 물질이 아니라 정보다. 그리고 신앙과 과학을 분리하려는 태도는 무의식적인 지식 숭배다. 과학을 깊이 공부할수록 기적이 보이기 시작한다."],"n":2021},{"id":"p11-7","title":"11-7. 지혜의 의학과 지식의 의학","key":[],"n":5597},{"id":"p11-8","title":"11-8. 교사가 의사다 — 뜻을 심어주는 사람이 곧 치유자다","key":[],"n":5380},{"id":"p11-9","title":"11-9. 관찰자 효과의 오독 — 뉴에이지와 '시크릿'의 착각","key":[],"n":1306},{"id":"p11-10","title":"11-10. 핵력 논증 — 원자핵의 존재 자체가 기적이다","key":[],"n":4087},{"id":"p11-11","title":"11-11. 캥거루 케어와 모아(母兒) 체온 동조 현상","key":[],"n":3934},{"id":"p11-12","title":"11-12. 질병은 죄의 형벌이 아니라 하나님이 하시는 일을 나타내는 기회다","key":[],"n":5108},{"id":"p11-13","title":"11-13. 변종 바이러스 시대, 면역 유전자를 지키는 길은 뉴스타트뿐이다","key":[],"n":6700},{"id":"p11-14","title":"11-14. 뉴턴 물리학의 차원과 양자물리학의 차원 — 치료와 치유가 일어나는 자리","key":[],"n":4776},{"id":"p11-15","title":"11-15. 천사는 강력한 에너지로 존재하는 하나님의 사신이다","key":[],"n":781},{"id":"p11-16","title":"11-16. 발열은 병이 아니라 바이러스를 죽이려는 면역 반응이다","key":[],"n":2583},{"id":"p11-17","title":"11-17. 면역 인내(톨러런스) — 이질적인 것을 제 것으로 인정해 주는 T세포의 성질","key":[],"n":2315},{"id":"p11-18","title":"11-18. 식물 지능(Plant Intelligence)이라는 개념의 재해석","key":[],"n":2914},{"id":"p11-19","title":"11-19. 바이러스만 골라 죽이는 약은 원리상 만들 수 없다","key":[],"n":790}]},{"id":"p12","title":"제12장 줄기세포와 재생","s":[{"id":"p12-1","title":"12-1. \"재생 불가\"라는 도그마가 무너진 과정","key":[],"n":783},{"id":"p12-2","title":"12-2. 가지는 줄기로 되돌아갈 수 있다 — 역분화","key":[],"n":426},{"id":"p12-3","title":"12-3. 재생의 조건 — 파괴가 먼저 멈춰야 한다","key":[],"n":118},{"id":"p12-4","title":"12-4. 성경적 읽기 — 갈비뼈","key":[],"n":489},{"id":"p12-5","title":"12-5. 실제 회복 사례","key":["&quot;안 된다&quot;는 말을 그대로 믿으면 실제로 안 된다. 하나님은 언제나, 기회만 나면 변질된 세포를 정상세포로 회복시키려 하고 계신다."],"n":25233},{"id":"p12-6","title":"12-6. 임신 중 부모의 정서와 태아 유전자","key":[],"n":4273},{"id":"p12-7","title":"12-7. 모든 세포 속의 잠재 유전자 — 대체 기관의 재활성화","key":[],"n":7860},{"id":"p12-8","title":"12-8. 소생과 부활의 구분 — 몸속에서 매일 일어나는 부활","key":[],"n":4093},{"id":"p12-9","title":"12-9. 전문 지식이 오히려 재생에 대한 믿음을 막는다","key":[],"n":1361},{"id":"p12-10","title":"12-10. 양육의 사랑(모성애)이 새끼의 면역력과 세포 재생력을 결정한다","key":[],"n":5793},{"id":"p12-11","title":"12-11. 흉터(반흔)도 유전자의 힘으로 사라질 수 있다 — 콜라겐 생성과 분해의 원리","key":[],"n":4963},{"id":"p12-12","title":"12-12. 자궁외임신은 생체 전자파 인도 신호의 교란이다","key":[],"n":677}]}]},"d":{"name":"질병편","front":[{"title":"이 책에 대하여","b":[{"t":"h","x":"<b>1. 무엇을 모은 책인가<\/b>"},{"t":"p","x":"이 책은 이상구 박사의 뉴스타트 건강강의 205기 · 206기 · 207기 · 208기 · 209기 · 210기 · 211기 · 212기 · 213기 · 214기 · 215기 · 216기 · 217기 · 218기 · 219기 · 220기 · 221기 · 222기 · 223기 · 224기 · 225기 · 226기 · 227기 · 228기 · 229기 · 230기 · 231기 · 232기 · 233기 · 234기 · 235기 · 236기 · 237기 · 239기 · 240기 · 241기 · 242기 · 243기 · 244기 · 245기 · 246기 · 247기 · 248기 · 249기 · 250기 · 251기 · 252기 · 253기 · 254기 · 255기 · 256기 · 257기 · 258기 · 259기 · 260기 · 261기 · 262기 · 263기 · 264기 · 265기 · 266기 · 267기 · 268기 · 269기 · 270기 · 271기 · 272기 · 273기 · 274기 · 275기 · 276기 · 277기 · 278기 · 279기 · 280기 · 281기 · 282기 · 283기 · 284기 · 285기 · 286기 · 287기 · 288기 · 289기 · 290기 · 291기 · 292기 · 293기 · 294기 · 295기 · 302기 · 303기 · 304기 · 305기 · 307기 · 308기 · 309기 · 310기 · 311기 · 312기 · 313기 · 315기, 총 102개 기수 1827편의 강의록을 하나로 합친 것이다."},{"t":"p","x":"이 통합본은 두 권으로 나뉘어 있다. 이 권은 <b>질병편<\/b>으로 제2부 「질병별 치유 원리」를 담고 있고, 건강의 원리는 <b>원리편<\/b>에 따로 실려 있다. 본문에서 「원리편 4-3」처럼 가리키는 대목은 원리편의 그 절을 말한다. 부록의 예화 색인과 수록 내용 색인은 이 권에 해당하는 항목만 실었으며, 성경 구절 색인·기수별 강의 목차 대조표·개정 이력은 두 권에 똑같이 들어 있다."},{"t":"p","x":"각 기수는 대개 14~18강으로 구성되어 있고, 기수가 달라도 다루는 핵심 원리는 거의 동일하다. 같은 원리가 기수마다 다른 예화, 다른 성경 구절, 다른 환자 사례로 반복해서 설명된다. 그래서 170편을 순서대로 읽으면 같은 이야기를 열 번 읽게 되고, 정작 어느 기수에만 나오는 귀한 내용은 그 반복에 묻혀 버린다."},{"t":"p","x":"이 통합본은 그 문제를 풀기 위해 만들어졌다. 기수(강의 순서)가 아니라 주제(건강의 원리와 질병명)를 축으로 전체를 다시 배열했다. 열 기수에 걸쳐 반복되는 내용은 한 자리에 모아 가장 완전한 형태로 서술하고, 특정 기수에만 등장하는 내용은 누락 없이 해당 주제 아래로 옮겨 붙였다."},{"t":"h","x":"<b>2. 어떻게 구성되어 있는가<\/b>"},{"t":"tbl","r":[["구성","내용","쓰임새"],["제1부 건강의 원리","질병관, 유전자 스위치, 생기, 뜻과 뇌파, 기본여건, 활성산소, 정신, 사실과 진실, 행복, 장수, 관찰자, 재생 — 12개 장","강의안·교육 커리큘럼의 뼈대"],["제2부 질병별 치유 원리","암, 자가면역질환, 당뇨병, 간경화, 우울증, 거식증, 비만, 호르몬 결핍 등 질병별 원인·기전·실천·사례","상담·개별 질문 대응"],["제3부 부록","8대 원칙 요약, 용어 사전, 성경 구절 색인, 예화 색인, 기수별 목차 대조표, 수록 내용 색인","검색과 앞으로의 업데이트"]]},{"t":"h","x":"<b>3. 본문 표기 규칙<\/b>"},{"t":"li","x":"파란 세로줄 문단은 강의에서 인용된 성경 구절이다."},{"t":"li","x":"연한 갈색 상자는 그 항목의 핵심을 한 문장으로 압축한 강의 포인트다. 강의안을 만들 때 이 문장을 그대로 슬라이드 제목으로 쓸 수 있다."},{"t":"li","x":"각 항목 끝의 회색 작은 글씨는 출처 기수와 강수다. 원문 강의록을 다시 확인해야 할 때 이 표기를 따라가면 된다."},{"t":"h","x":"<b>4. 이 자료를 다룰 때의 주의<\/b>"},{"t":"p","x":"원 강의록은 유튜브 자동자막(ASR)을 바탕으로 정리된 것이다. 따라서 다음 세 가지는 인용 전에 확인이 필요하다."},{"t":"li","x":"강의 중 언급된 연구 발표 시점·논문 저자명·통계 수치는 강사의 구두 진술이며, 별도 검증을 거치지 않았다."},{"t":"li","x":"성경 장·절은 강사가 직접 밝히지 않고 취지만 말한 경우가 많아, 원 강의록에 &quot;확인필요&quot;로 표시된 항목이 상당수 있다."},{"t":"li","x":"참가자 실명은 원 강의록에서 표기가 흔들리는 경우가 있어, 이 통합본에서도 강의에서 반복 등장하는 별칭 위주로만 적었다."},{"t":"p","x":"또한 이 자료는 이상구 박사의 강의 내용을 그대로 정리한 것이며, 현대 의학의 표준 진료 지침이나 의학적 조언을 대체하지 않는다. 교육과 학습을 위한 정리물로 사용하기를 권한다."},{"t":"h","x":"<b>5. 앞으로 이 파일을 어떻게 키워 가는가<\/b>"},{"t":"p","x":"이 통합본은 완결된 책이 아니라 계속 자라는 기준 문서로 설계되었다. 새로운 기수의 강의를 정리했을 때 이 파일 전체를 다시 만들 필요가 없다. 제3부 부록의 「수록 내용 색인」과 「업데이트 절차」를 따라, 이미 들어 있는 내용은 건너뛰고 새로운 것만 해당 장에 덧붙이면 된다. 자세한 절차는 부록 6절에 있다."}]},{"title":"전체 논리 한눈에 보기","b":[{"t":"p","x":"1827편의 강의를 관통하는 논리는 단 하나의 사슬이다. 이 사슬을 이해하면 어느 강의를 펼쳐도 지금 어디를 이야기하고 있는지 알 수 있다."},{"t":"h","x":"<b>아홉 칸의 사슬<\/b>"},{"t":"tbl","r":[["단계","명제"],["1","사람의 몸은 세포로만 되어 있다. 그러므로 모든 질병은 세포의 변질이다."],["2","세포의 성질을 결정하는 것은 유전자다. 그러므로 모든 질병은 유전자의 변질이다."],["3","변질이란 유전자가 없어진 것이 아니라 꺼진 것(OFF)이다. 유전자는 후천적으로 켜지고 꺼진다(후성유전학)."],["4","유전자를 켜고 끄는 물리적 스위치는 메틸기(CH₃)의 부착(메틸화)과 제거(탈메틸화)다."],["5","메틸기는 전기를 띤 화학물질일 뿐 지능이 없다. 스스로 움직이지 못하고 생체 전자파 신호를 받아 움직인다."],["6","생체 전자파의 출발점은 뇌파이고, 뇌파를 알파파로 만들지 베타파로 만들지 결정하는 것은 뜻(의미·해석)이다."],["7","그 뜻에 담긴 힘, 곧 영적 에너지가 물리적 에너지를 지배한다. 그 영적 에너지의 이름이 생기(生氣)다."],["8","생기는 진(眞)·선(善)·미(美) 안에 담겨 있고, 이 셋을 합한 것이 사랑이며, 그중 생기의 원천은 무조건적 사랑(아가페)이다."],["9","생기는 값없이 조건 없이 주어지지만 아무 자리에나 내려앉지 않는다. 기본여건(뉴스타트 8대 원칙)이 갖추어진 자리에 온다."]]},{"t":"h","x":"<b>이 사슬이 만드는 세 가지 결론<\/b>"},{"t":"li","x":"치료(treatment)와 치유(healing)는 다르다. 약·수술·방사선은 결과를 처치할 뿐 꺼진 유전자를 켜지 못한다. 원인이 남아 있으므로 재발은 우연이 아니라 예정된 결과다."},{"t":"li","x":"불치병이라는 개념은 성립하지 않는다. 유전자가 변하지 않는다는 전제 위에서만 &quot;불치&quot;가 성립한다. 유전자가 변한다면 남는 질문은 &quot;낫느냐&quot;가 아니라 &quot;무엇이 이 유전자를 껐는가&quot;이다."},{"t":"li","x":"낫는 것이 목표가 아니다. 낫는 것만을 조건으로 삼는 순간 그것 자체가 조건적 사고가 되어 다시 생기를 막는다. 목표는 무조건적 사랑을 아는 것이고, 회복은 그 결과다."},{"t":"key","x":"이 사슬 전체를 한 문장으로 줄이면 이렇다 — &quot;모든 질병은 유전자가 꺼진 상태이고, 그 유전자를 켜는 에너지는 무조건적 사랑이며, 사람이 할 일은 그 사랑이 내려앉을 기본여건을 갖추고 그것을 선택하는 것이다.&quot;"}]}],"toc":[{"id":"d1","title":"제1장 암 — 총론","s":[{"id":"d1-1","title":"1-1. 원인","key":[],"n":22467},{"id":"d1-2","title":"1-2. 기전 ① — 암세포와 T세포는 서로를 알아본다","key":["매일 켜졌다 꺼지는 유전자 — 미토콘드리아에서 에너지를 만드는 과정의 부산물로 활성산소가 발생하며, 이 활성산소가 유전자(핵산)와 세포막을 산화시켜 정상세포를 변질시키고 암세포로 만든다. 그러나 이렇게 매일 생기는 암세포는 몸속의 T세포가 곧바로 알아보고 죽여 없앤다. 강사 자신의 몸에서도 팔십 년 동안 매일 암세포가 생겼으나 매일 죽었기 때문에 아직 암 환자가 아니다. 예순다섯 살에 암 진단을 받았다면 그 사람의 몸에서 예순다섯 해 동안 매일 암세포가 생겼고 매일 죽었다는 뜻이며, 진단을 받기 한두 해 전, 또는 3~4년 전부터 암의 자연치유 현상이 일어나지 않았다는 뜻이다. 그러므로 암에 걸린다는 것은 새로운 세포가 생긴 사건이 아니라 평생 매일 일어나던 정상적 방어가 어느 시점에 멈춘 사건이며, 재수가 없어 암세포가 생겼다는 말은 성립하지 않는다. 정상세포가 변질되어 암 덩어리로 자라 진단받기까지는 상당한 시간, 적어도 3~4년이 걸리는 반면 이미 변질된 유전자가 다시 정상으로 돌아가는 속도는 그보다 훨씬 빠를 수 있어, 뉴스타트 참가자 중에는 3개월에서 6개월 만에 상태가 호전된 사례들이 있다. 변질에는 오랜 시간이 걸리지만 회복은 빠르다. 켜고 끄는 일은 메틸기가 맡는다. 메틸기는 탄소 원자 하나에 수소 원자 셋이 붙은 물질로, 히스톤 옆의 스위치 자리에 붙으면 유전자가 꺼지고 떨어져 나가면 켜진다. 그러므로 병이란 유전자가 꺼진 상태 자체가 아니라 이 왕복이 멈춰 버린 상태다. 메틸기가 스위치에 붙은 채 떨어지지 않는 이유는 기가 막히고 억장이 무너지고 미움을 품은 마음이 계속 그 자리를 붙들고 있기 때문이며, 사람이 할 수 있는 일은 메틸기를 직접 떼는 것이 아니라 좋은 뜻을 품어 그것이 떨어져 나가도록 하는 것뿐이다. 그리고 유전자를 끄는 데는 시간이 걸리지 않는다. 생기가 들어와 열심히 암세포를 죽이던 세포도 그 사람이 「그 자식이 나한테 사기를 쳤다」고 느끼는 바로 그 순간 더 이상 죽이지 못하게 된다. 모든 사람의 몸 안에서 암세포는 날마다 생기고 있으므로 날마다 유전자가 상처를 받고 있다는 뜻이기도 하다. 그러므로 배신감을 품고 사는 일은 곧 항암 유전자를 매일 꺼 두는 일이며, 두고 보자는 복수심과 증오와 분노를 청소하는 것 말고는 유전자를 회복시키는 약이 없다. 유전자의 변질도 단번에 암이 되는 것이 아니라 정도에 따라 단계를 밟는다. 대장이나 직장의 세포 유전자가 조금 변질되기 시작하면 아직 암은 아니고 용종이 생기며, 자궁의 세포가 정상에서 비정상으로 변하기 시작한 것을 자궁 세포의 이형성이라 부르고, 위장에서는 위장세포가 장세포처럼 변해 가는 장상피화생이나 점막이 얇아지는 위축성 위염이 첫 단계로 나타난다. 이 모든 것은 몸을 흐르는 생체 전자파가 어떤 파냐에 따라 유전자가 변질되어 가는 과정의 중간 지점이며, 암은 그 변질이 충분히 누적된 끝에 붙는 이름이다. 한편 T세포 안에는 암세포를 죽이는 물질을 만드는 유전자와 무좀 곰팡이를 죽이는 물질을 만드는 유전자가 나란히 붙어 있어 하나가 켜지면 다른 하나도 함께 켜진다. 뉴스타트를 시작한 지 몇 달 만에 십몇 년 된 무좀이 사라졌다면 그것은 같은 자리의 유전자들이 함께 켜졌다는 표시이므로 암도 낫겠다고 말할 근거가 되며, 참가자의 그 직관은 근거 없는 낙관이 아니라 유전자 발현의 인접성에 대한 정확한 읽기다. 이는 몸의 회복이 병 하나씩 따로 오는 것이 아니라 켜지는 유전자 묶음 단위로 온다는 뜻이기도 하다. T세포는 암세포만 죽이는 세포가 아니어서 나병균이나 결핵균 같은 균도 죽이므로, 사랑을 느끼는 순간 꺼져 있던 T세포의 유전자가 켜지면 그 결과는 암에서만이 아니라 오랜 감염병에서도 똑같이 나타난다. 그리고 이 세포들이 이 환자의 그 마음을 어떻게 그렇게 자세히 알고 있는가 — 이것이 이 강의가 던지는 질문이다."],"n":26232},{"id":"d1-3","title":"1-3. 기전 ② — 암 동면(tumor dormancy)","key":[],"n":8721},{"id":"d1-4","title":"1-4. 기전 ③ — 전이는 우연이 아니다","key":["전이는 무작위 사고가 아니라, 암세포가 T세포의 무력함을 감지하는 순간에만 일어나는 조건적 사건이다. 암과 면역세포의 관계는 서로 &#x27;눈치를 본다&#x27;는 표현으로 설명된다. 변질된 세포가 수년, 심지어 십 년 넘게 몸속에 잠복해 있다가도 T세포와 관련된 유전자가 어느 순간 다시 꺼지고 면역력이 약해지면 그제야 전이가 시작된다. 즉 암이 세월이 흐른다고 저절로 악화되거나 퍼지는 것이 아니라, T세포가 조금이라도 강해지는 낌새를 보이면 암세포는 숨을 죽이고 T세포가 약해지면 곧바로 세력을 넓히는 식으로 면역 상태에 정교하게 반응한다. 그러므로 알파파를 유지해 T세포 유전자를 켜 두는 것 자체가 전이를 막는 실제 행위가 된다. 이 원리는 항암치료 자체가 백혈구와 면역세포를 파괴하는 방식으로 작동하기 때문에 근본적으로 암을 치유할 수 없다는 논지로 이어진다."],"n":7003},{"id":"d1-5","title":"1-5. 기전 ④ — 암복귀(reversion)와 \"아리랑 고개\"","key":[],"n":17989},{"id":"d1-6","title":"1-6. 항암제 1~4세대와 그 한계","key":[],"n":50277},{"id":"d1-7","title":"1-7. 실천 지침","key":[],"n":15592},{"id":"d1-8","title":"1-8. 사례","key":[],"n":32846},{"id":"d1-9","title":"1-9. 재발은 흔들림이다 — 처방은 초심의 회복","key":[],"n":9651},{"id":"d1-10","title":"1-10. 우연히 발견된 조기암의 함정 — 도려냈다고 원인이 사라지지 않는다","key":[],"n":6074},{"id":"d1-11","title":"1-11. 항암·방사선치료와 영양 — 폭격 비유로 본 병원 식이 권고","key":[],"n":5109},{"id":"d1-12","title":"1-12. 림프부종 — 유방암 수술 후 임파성 부종","key":[],"n":1221},{"id":"d1-13","title":"1-13. 가장 좋은 반응을 보이는 환자 — '유기농' 환자","key":[],"n":4121},{"id":"d1-14","title":"1-14. 자연치유가 투병으로 변질되는 위험","key":[],"n":2497},{"id":"d1-15","title":"1-15. 항암치료 통계에는 치유율이 없고 생존율만 있다","key":[],"n":10905},{"id":"d1-16","title":"1-16. 한 암 덩어리 속 세포는 이질적이다 — 반복 치료가 내성만 남기는 이유","key":[],"n":7316},{"id":"d1-17","title":"1-17. 죽음을 복수의 수단으로 선택할 때 — T세포가 그 선택을 실행한다","key":[],"n":2278},{"id":"d1-18","title":"1-18. 유방암","key":[],"n":5040},{"id":"d1-19","title":"1-19. 전립선암","key":[],"n":1457}]},{"id":"d2","title":"제2장 자가면역질환","s":[{"id":"d2-1","title":"2-1. 하나의 뿌리, 여러 개의 병명","key":[],"n":5862},{"id":"d2-2","title":"2-2. 원인 — T세포는 주인의 뜻을 따른다","key":["T세포는 주인의 뜻을 읽는다. 오래 참고 살다 지쳐 죽고 싶다, 이렇게 사느니 차라리, 나는 벌을 받아야 한다는 뜻을 품으면 T세포들이 그 뜻을 문자 그대로 집행한다. 강사는 그 경로의 시작을 배신으로 짚는다. 누구나 배신을 당할 수 있고, 특히 가장 신뢰하던 사람에게 배신을 당하면 억울함이 남는다. 그 억울함을 잊지 못하도록 악령이 계속 자극하고, 그것을 거부하지 않고 받아들이면 증오와 분노를 되풀이해 선택하는 상태가 된다. 누군가를 향해 공격하고 싶은 마음이 일지만 그것을 계속 억누르다 보면 지쳐서 이렇게 힘들게 사느니 차라리 죽는 편이 낫겠다는 생각에 이르는 사람이 많고, 심한 경우 남도 죽이고 나도 죽고 싶다는 데까지 간다. 이 나쁜 뜻, 곧 죽고 싶다는 뜻이 뇌파로 전달되고 뇌파는 다시 생체전자파로 바뀌어 최종적으로 T세포의 유전자에 영향을 미친다. 강의는 이를 T세포들이 주주총회를 열어 공격 부위를 결정하는 장면으로 묘사한다 — &quot;우리 주인님이 자꾸 죽고 싶어 하시는 것 같다. 그러면 우리가 협조해 드려야지.&quot; 반복되는 부정적 생각이 곧 유전자에 내리는 명령이라는 것을 보여주는 의인화된 비유다. 유전자는 뜻에 반응하므로, 주인이 스스로를 없애고 싶다는 뜻을 계속 내보내면 나를 지키도록 만들어진 세포가 나를 없애는 쪽으로 유전자를 바꾼다. 자가면역성 질병이란 몸이 주인의 뜻을 정확히 알아듣고 실행한 결과라는 것이 강사의 결론이다."],"n":25088},{"id":"d2-3","title":"2-3. 기전과 치유 원리","key":[],"n":19052},{"id":"d2-4","title":"2-4. 실천 지침","key":[],"n":9582},{"id":"d2-5","title":"2-5. 안젤라 이야기 — 죄책감이 만든 병","key":["하나님을 잘못 알면, 아프다고 말할 자유조차 사라진다."],"n":12332},{"id":"d2-6","title":"2-6. 신증후군 — 존재감을 잃은 누나","key":[],"n":7528},{"id":"d2-7","title":"2-7. 그 밖의 자가면역 사례","key":[],"n":9688},{"id":"d2-8","title":"2-8. 죽음이라는 병과 부활의 약속","key":[],"n":1218},{"id":"d2-9","title":"2-9. 류마티스 관절염 — 면역억제제의 딜레마","key":[],"n":8598},{"id":"d2-10","title":"2-10. 갑상선기능항진증","key":[],"n":4418},{"id":"d2-11","title":"2-11. 자가면역성 간염 · 녹내장 · 망막박리증 — 또 다른 표적들","key":[],"n":2389},{"id":"d2-12","title":"2-12. 자가면역성 원형탈모","key":[],"n":1427},{"id":"d2-13","title":"2-13. 자가면역성 침샘·눈물샘 질환 — 구강건조·안구건조","key":[],"n":627},{"id":"d2-14","title":"2-14. 자가면역성 피부질환 — 건선과 아토피","key":[],"n":1548},{"id":"d2-15","title":"2-15. 자가면역성 신장질환","key":[],"n":1784},{"id":"d2-16","title":"2-16. 자가면역성 신경계 질환 — 다발성 신경마비와 루게릭병","key":[],"n":1892},{"id":"d2-17","title":"2-17. 전신성 홍반성 낭창(루푸스)","key":[],"n":4900},{"id":"d2-18","title":"2-18. 정죄와 회개의 구분 — 죄책감은 사탄, 자유케 하는 진리는 성령","key":[],"n":2724},{"id":"d2-19","title":"2-19. 자가면역성 장질환 — 만성 설사형","key":[],"n":2129},{"id":"d2-20","title":"2-20. 백반증 — 멜라닌 세포를 공격하는 자가면역","key":[],"n":659},{"id":"d2-21","title":"2-21. 자가면역성 갑상선기능저하증","key":[],"n":799},{"id":"d2-22","title":"2-22. 자가면역성 용혈성 빈혈","key":[],"n":1087},{"id":"d2-23","title":"2-23. 폐고혈압 — 폐혈관을 공격하는 자가면역","key":[],"n":851},{"id":"d2-24","title":"2-24. 타카야수 동맥염 — 큰 혈관을 공격하는 자가면역","key":[],"n":843},{"id":"d2-25","title":"2-25. 자가면역성 척추관협착증","key":[],"n":1749},{"id":"d2-26","title":"2-26. 자가면역성 이명·난청 — 청신경을 공격하는 자가면역","key":[],"n":954},{"id":"d2-27","title":"2-27. 염증의 진짜 후유증은 흉터다 — 자가면역 질환을 흉터의 문제로 다시 읽는다","key":[],"n":1950},{"id":"d2-28","title":"2-28. 백신 접종 후의 자가면역성 혈소판감소증","key":[],"n":1907},{"id":"d2-29","title":"2-29. 자가면역성 재생불량성 빈혈 — T세포가 골수를 공격한 자리","key":[],"n":1251},{"id":"d2-30","title":"2-30. 강직성 척추염 — 척추뼈 사이를 공격하는 자가면역","key":[],"n":807},{"id":"d2-31","title":"2-31. 염증 반응의 두 얼굴 — 병균을 잡는 염증과 뜻에 반응하는 무균성 염증","key":[],"n":1885},{"id":"d2-32","title":"2-32. 원발성 담즙성 담관염 — 자기 담관을 공격하는 자가면역","key":[],"n":769}]},{"id":"d3","title":"제3장 당뇨병","s":[{"id":"d3-1","title":"3-1. 무엇이 막혔는가","key":["덮개는 왜 생기는가. 몸의 지극히 합리적인 판단 때문이다 — 안 쓰는 물건은 덮어 둔다. 레지스틴은 단백질이고 모든 단백질은 유전자가 만들며, 이런 물질은 필요할 때 생산되게 되어 있다. 문이 활짝 열려야 하는 상황은 에너지를 많이 생산해야 하는 상황, 곧 운동하는 삶이다. 운동을 하지 않으면 에너지를 만들 필요가 없고, 에너지가 필요 없으면 문을 열 일이 없으며, 문을 열 일이 없으면 초인종을 쓸 일도 없다. 쓰지 않는 초인종은 손상되지 않도록 덮어 두는 것이 합리적이므로 몸은 덮개 생산 유전자를 켠다. 세포가 운동 부족·에너지 과잉 등으로 &#x27;포도당 에너지를 쓰지 않기로&#x27; 선택하면 유전자가 포도당수송체 위에 일종의 &#x27;더께&#x27;를 만들어 씌워 스위치 감도를 일부러 둔화시키는 것이다. 그러므로 인슐린 저항은 고장이 아니라 몸이 판단한 결과이며, 그 판단을 만든 것이 운동하지 않는 생활이다."],"n":12153},{"id":"d3-2","title":"3-2. 세 가지 원인","key":[],"n":20273},{"id":"d3-3","title":"3-3. 치유 원리","key":["약은 혈당 수치를 눌러 줄 뿐 덮개를 벗기지 못한다. 덮개는 오직 운동으로만 벗겨진다. 당뇨병의 원인이 유전자·생활·마음 세 층위에 걸쳐 있으므로, 어떤 약을 쓰든 원인이 그대로 남아 있으면 병이 낫지 않는다. 약은 혈당이 지나다니는 문을 일시적으로 억지로 열어 줄 뿐이며, 근본 원인이 제거되지 않는 한 아무리 좋은 약도 소용이 없다. 강사는 당뇨약이란 결국 인슐린을 더 많이 만들도록 췌장을 압박하는 방법일 뿐 근본 원인(꺼진 유전자)을 고치지 못한다고 지적한다. &#x27;이 약은 평생 먹어야 한다&#x27;는 말은 나을 병이 아니라는 뜻이 아니라, 약은 어차피 원인(스트레스·운동부족·고지방식)을 없애지 못하므로 죽을 때까지 먹어도 낫지 않는다는 뜻으로 재해석된다. 대신 사랑(생기)을 많이 받고 저지방 식사를 하며 운동을 하고 기본여건을 갖추면 당뇨병은 물러갈 수밖에 없으며, 그 원인 자체를 제거하면 당뇨병과 동맥경화에서 나을 수 있다. 인슐린 저항성을 낮추는 데 특별한 신비 약이나 건강보조식품은 필요 없으며, 기본여건을 갖춘 뉴스타트만 제대로 실천하면 며칠 안에 당뇨약을 끊을 수 있을 정도로 쉽게 좋아진다. 이 원리는 걸린 지 20년, 30년, 40년 된 당뇨병에도 동일하게 적용된다. 당뇨병은 면역력에 심각한 문제가 있어 생기는 병이 아니라, 원리를 알면 뉴스타트로 간단히 회복될 수 있는 비교적 단순한 병이며, 소변에 당이 나오는 것은 결과일 뿐이므로 그 배후의 유전자 상태를 회복시키면 문제가 해결된다. 현대의학이 복잡해 보이지만 파고 들어가면 답은 간단하며, 생명의 원리를 따르는 뉴스타트만으로도 당뇨병의 완전한 정복이 가능하다."],"n":25837},{"id":"d3-4","title":"3-4. 합병증 — 모세혈관의 문제","key":[],"n":8856},{"id":"d3-5","title":"3-5. 사례","key":[],"n":8797},{"id":"d3-6","title":"3-6. 탄수화물이란 무엇인가 — 태양 에너지의 저장 형태","key":[],"n":5772},{"id":"d3-7","title":"3-7. 자가면역성 당뇨병 — 소아형(1형) 당뇨병","key":[],"n":3284},{"id":"d3-8","title":"3-8. 당분은 사랑이 물질화된 것 — 태양에서 세포까지의 에너지 사슬","key":[],"n":3083}]},{"id":"d4","title":"제4장 간경화와 간암","s":[{"id":"d4-1","title":"4-1. 두 층위의 문제","key":[],"n":171},{"id":"d4-2","title":"4-2. 콜라게나제 — 발견의 과정","key":["콜라게나제 유전자는 하나님이 간에 흉터가 생길 것을 미리 아시고 넣어 두신 회복 유전자다. 문제는 그것이 지금 꺼져 있다는 것뿐이다."],"n":314},{"id":"d4-3","title":"4-3. 현대 의학의 비일관성","key":[],"n":255},{"id":"d4-4","title":"4-4. 이식의 딜레마","key":[],"n":124},{"id":"d4-5","title":"4-5. 실천 지침","key":[],"n":181},{"id":"d4-6","title":"4-6. 사례","key":[],"n":31889},{"id":"d4-7","title":"4-7. 바이러스성 간염 — B형·C형","key":[],"n":7964},{"id":"d4-8","title":"4-8. 간암 — P53 항암유전자가 꺼진 자리","key":[],"n":8635}]},{"id":"d5","title":"제5장 우울증과 불면증","s":[{"id":"d5-1","title":"5-1. 우울증 — 엔도르핀이 생산되지 않는 상태","key":["사랑이 존재하는 것과 그것을 인식하는 것은 별개다. 인식해야 생기가 통로를 얻는다."],"n":39446},{"id":"d5-2","title":"5-2. 불면증","key":["실천 지침 — 용서가 안 되면 용서하겠다고 억지로 기도하지 마라. 지금 할 수 있는 정직한 기도부터 하라. 그리고 노래하라."],"n":12184},{"id":"d5-3","title":"5-3. 조절장애 — 분노조절장애·공황장애·수면장애","key":[],"n":9675},{"id":"d5-4","title":"5-4. 마약(약물) 중독","key":[],"n":9681},{"id":"d5-5","title":"5-5. 강박증 — 조건적 사고가 만드는 반복 행동","key":[],"n":1480},{"id":"d5-6","title":"5-6. 공황장애 — 두려움을 다스리는 유전자가 꺼진 상태","key":[],"n":16559},{"id":"d5-7","title":"5-7. 분노조절장애 — 자제력의 유전자와 무조건적 사랑","key":[],"n":10895},{"id":"d5-8","title":"5-8. 다중인격장애(해리성 정체감 장애)","key":[],"n":2642},{"id":"d5-9","title":"5-9. 공포증(포비아) — 죽음과 질병에 대한 과도한 두려움","key":[],"n":2507},{"id":"d5-10","title":"5-10. 성격장애 — 공감 능력의 결여","key":[],"n":2608}]},{"id":"d6","title":"제6장 거식증·비만·다이어트","s":[{"id":"d6-1","title":"6-1. 거식증 — 몸매라는 우상","key":["중요한 경고 — 우상은 치워지는 것이 아니라 교체된다. 회복된 뒤 「반에서 1등」이라는 새 우상이 그 자리를 차지해 밤새 공부하게 된 사례가 있다. 지속적인 돌봄이 필요한 이유다."],"n":23525},{"id":"d6-2","title":"6-2. 비만과 다이어트 — 굶는 다이어트가 실패하는 이유","key":["지방세포 입장에서 강제적 다이어트는 &#x27;흉년&#x27;의 신호다. 다음 흉년에 대비해 저장량을 늘린다. 그래서 요요가 오고, 반복할수록 기준선이 계단처럼 높아진다."],"n":10432},{"id":"d6-3","title":"6-3. 성형중독 — 외모지상주의가 심어 놓은 두려움의 병","key":[],"n":1687},{"id":"d6-4","title":"6-6. 폭식증 — 채워지지 않는 허기","key":[],"n":1283}]},{"id":"d7","title":"제7장 육종암 — 복음으로 치유된 사례","s":[{"id":"d7-1","title":"7-1. 환자","key":[],"n":1003},{"id":"d7-2","title":"7-2. 무엇이 막고 있었는가","key":[],"n":176},{"id":"d7-3","title":"7-3. 무엇이 풀었는가","key":["십계명을 성적표가 아니라 진단서로 읽으라. &quot;못 지킨다&quot;는 결론에서 자책이 아니라 십자가로 가라. 구원의 확신은 신앙의 결승선이 아니라 출발선이다."],"n":1414},{"id":"d7-4","title":"7-4. 경과","key":[],"n":1374},{"id":"d7-5","title":"7-5. 다른 육종암 사례","key":[],"n":3687}]},{"id":"d8","title":"제8장 여성호르몬 결핍과 갱년기","s":[{"id":"d8-1","title":"8-1. 난소 절제 후에도 여성호르몬은 만들어진다","key":["지식이 많을수록 &quot;난소가 없으면 호르몬도 없다&quot;는 명제를 먼저 확정해 회복의 길을 스스로 닫아 버린다. 여기서 &quot;똑똑한 부정&quot;보다 &quot;멍청한 긍정&quot;이 낫다는 원리가 그대로 적용된다."],"n":579},{"id":"d8-2","title":"8-2. 갱년기 장애 — 폐경인가 완경인가","key":["&quot;폐(閉)&quot;는 문을 닫는다는 뜻이다. &quot;폐경 = 여자로서 끝났다&quot;는 뜻을 스스로 붙이는 것, 그 뜻이 난소의 여성호르몬 유전자에 전달되는 것이 원인이다."],"n":273},{"id":"d8-3","title":"8-3. 상상임신 — 뜻이 유전자를 켠다는 결정적 증거","key":["사실이 몸을 바꾼 것이 아니다. 그가 붙든 뜻이 몸을 바꾸었다."],"n":29568}]},{"id":"d9","title":"제9장 그 밖의 질병들","s":[{"id":"d9-1","title":"9-1. 만성피로증후군 — 부신과 갑상선, 그리고 마음","key":[],"n":2726},{"id":"d9-2","title":"9-2. 감기와 바이러스 감염","key":[],"n":1584},{"id":"d9-3","title":"9-3. 공황장애·불면증·공포증 — 두려움이 만드는 병","key":[],"n":3272},{"id":"d9-4","title":"9-4. 강사 자신이 앓았던 열다섯 가지 병","key":[],"n":9040},{"id":"d9-5","title":"9-5. 골절·골다공증·성장 — 뼈는 살아 있는 조직이다","key":[],"n":8212},{"id":"d9-6","title":"9-6. 백혈병","key":[],"n":169     if (inList){ h += '</ul>'; inList = false; }
    if (b.t === 'h') h += '<h3>' + strip(b.x) + '</h3>';
    else if (b.t === 'key') h += '<div class="key">' + mk(b.x) + '</div>';
    else if (b.t === 'verse') h += '<div class="verse">' + mk(b.x) + '</div>';
    else if (b.t === 'src') h += '<div class="src">📎 ' + b.x + '</div>';
    else if (b.t === 'tbl') h += '<div class="tw"><table>' + b.r.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</table></div>';
    else h += '<p>' + mk(b.x) + '</p>';
  }
  if (inList) h += '</ul>';
  return h;
}

// ---------- 서버 동기화 (Firebase · 섬김성장노트와 같은 프로젝트, healthu/{열쇠}) ----------
// 이름+전화번호로 만든 열쇠 하나에 기록을 모아 여러 기기가 같이 쓰고, 관리자 화면은 같은 문서로 명단을 관리한다.
const SYNC = window._SYNC = (() => {
  let FS = null, UID = null, T = null, UKEY = null, pulled = false, dirty = true, busy = false;
  let st = {ok: false, err: '', at: null};
  async function ukey(){
    const src = 'health|' + S.profile.phone + '|' + S.profile.name.replace(/\s+/g, '');
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(src));
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 40);
  }
  function init(){
    if (FS || !window.firebase || !window.FB_CONFIG) return;
    try {
      firebase.initializeApp(window.FB_CONFIG);
      FS = firebase.firestore();
      firebase.auth().onAuthStateChanged(async u => {
        if (!u){ firebase.auth().signInAnonymously().catch(e => { st.err = e.code || e.message; }); return; }
        UID = u.uid; await pull(); now();
      });
    } catch(e){ st.err = e.message; }
  }
  const errOf = e => e && e.code === 'permission-denied' ? '서버 권한 설정이 아직 안 되었습니다' : (e && (e.code || e.message)) || '';
  function merge(R){
    if (!R) return false;
    let ch = false;
    for (const [k, v] of Object.entries(R.read || {})) if (!S.read[k]){ S.read[k] = v; ch = true; }
    const mk = [...new Set([...S.marks, ...(R.marks || [])])]; if (mk.length !== S.marks.length){ S.marks = mk; ch = true; }
    for (const [d, m] of Object.entries(R.days || {})){ S.days[d] = S.days[d] || {}; for (const k of Object.keys(m)) if (!S.days[d][k]){ S.days[d][k] = 1; ch = true; } }
    S.noteAt = S.noteAt || {};
    for (const [k, v] of Object.entries(R.notes || {})){
      const ra = (R.noteAt || {})[k] || 0, la = S.noteAt[k] || 0;
      if (!(k in S.notes) || ra > la){ if (S.notes[k] !== v){ S.notes[k] = v; S.noteAt[k] = ra; ch = true; } }
    }
    if ((R.lastAt || 0) > (S.lastAt || 0)){ S.last = R.last; S.lastAt = R.lastAt; ch = true; }
    const vd = [...new Set([...(S.visits || []), ...(R.visits || [])])].sort().slice(-400); if (vd.length !== (S.visits || []).length){ S.visits = vd; ch = true; }
    return ch;
  }
  async function pull(){
    try {
      if (!FS || !UID || !S.profile) return;
      UKEY = await ukey();
      const d = await FS.collection('healthu').doc(UKEY).get();
      pulled = true; st.err = '';
      if (d.exists){
        const D = d.data();
        S.status = D.status || '';
        if (merge(D.state)){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} if (!(document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName))) route(); }
      } else S.isNew = true;
      dirty = true;
    } catch(e){ st.err = errOf(e); }
  }
  function summary(){
    const rd = Object.keys(S.read);
    const planDays = Object.keys(S.days).filter(k => Object.keys(S.days[k]).length).sort();
    const ua = /iPad/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1) ? 'iPad' : /iPhone/.test(UA) ? 'iPhone' : /Android/.test(UA) ? 'Android' : 'PC';
    return {name: S.profile.name, phone: S.profile.phone, group: S.profile.group || '',
      readN: rd.length, readP: rd.filter(k => k[0] === 'p').length, readD: rd.filter(k => k[0] === 'd').length,
      planDays: planDays.length, lastPlan: planDays[planDays.length - 1] || '', todayPlan: dayScore(today()),
      noteN: Object.keys(S.notes).length, markN: S.marks.length, visitN: (S.visits || []).length, lastVisit: (S.visits || []).slice(-1)[0] || '',
      lastId: S.last || '', lastTitle: S.last && SEC[S.last] ? SEC[S.last].title : '',
      installed: S.installed || '', ua, ver: VER,
      updated: firebase.firestore.FieldValue.serverTimestamp()};
  }
  async function now(){
    clearTimeout(T); init();
    if (!FS || !UID || !S.profile || busy) return;
    if (!pulled){ await pull(); if (!pulled) return; }
    if (!dirty) return;
    busy = true; dirty = false;
    try {
      const sm = summary();
      const st2 = {read: S.read, marks: S.marks, days: S.days, notes: S.notes, noteAt: S.noteAt || {}, last: S.last || null, lastAt: S.lastAt || 0, visits: S.visits || []};
      const doc = Object.assign({}, sm, {state: st2, ['devices.' + UID]: sm.ua});
      if (S.isNew){ doc.joined = firebase.firestore.FieldValue.serverTimestamp(); }
      const fields = Object.keys(doc);
      const data = Object.assign({}, sm, {state: st2, devices: {[UID]: sm.ua}});
      if (S.isNew) data.joined = doc.joined;
      await FS.collection('healthu').doc(UKEY).set(data, {mergeFields: fields.map(f => f)});
      if (S.isNew){ delete S.isNew; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
      st.ok = true; st.at = new Date(); st.err = '';
    } catch(e){ dirty = true; st.err = errOf(e); }
    busy = false;
  }
  return {
    init, now, status: () => st,
    later(){ dirty = true; clearTimeout(T); T = setTimeout(now, 2500); },
    async relink(){ pulled = false; UKEY = null; init(); for (let i = 0; i < 40 && !(FS && UID); i++) await new Promise(r => setTimeout(r, 250)); await pull(); dirty = true; await now(); }
  };
})();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') SYNC.now(); });
