  let h = `<div style="margin:0 4px 12px"><div class="small muted">${c.bk === 'p' ? '원리편' : '질병편'} 제${chNo(c.title)}장</div><b style="font-size:19px">${esc(chName(c.title))}</b></div><div class="card" style="padding:4px 14px"><ul class="list">`;
  for (const s of c.s){
    h += `<li><a href="#/s/${s.id}"><span class="n">${num(s.title)}</span><span class="t">${esc(shortT(s.title))}${s.key[0] ? '<small>' + esc(strip(s.key[0])) + '</small>' : ''}</span>${S.read[s.id] ? '<span class="chk">✓</span>' : ''}</a></li>`;
  }
  V.innerHTML = h + '</ul></div>';
}

async function vSec(sid, q){
  const s = SEC[sid]; if (!s) return vHome();
  const c = CH[s.ch];
  setTop(shortT(s.title), '#/c/' + c.id, sid); tab(s.bk === 'p' ? 'p' : 'd');
  V.innerHTML = '<div class="empty">불러오는 중…</div>';
  let data;
  try { data = await load(c.id); } catch(e){ V.innerHTML = '<div class="empty">내용을 불러오지 못했습니다.<br>인터넷 연결을 확인해 주세요.</div>'; return; }
  if (location.hash.split('?')[0] !== '#/s/' + sid) return;
  const sec = data.s.find(x => x.id === sid);
  const i = ORDER.indexOf(sid), prev = ORDER[i-1], next = ORDER[i+1];
  const hl = q ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g') : null;
  let h = `<article class="reader"><div class="crumb">${s.bk === 'p' ? '원리편' : '질병편'} · ${esc(c.title)}</div><h2>${esc(s.title)}</h2>`;
  if (s.si === 0 && data.b.length) h += blocks(data.b, hl);
  h += blocks(sec.b, hl) + '</article>';
  h += `<button class="btn ${S.read[sid] ? '' : 'pri'} done-btn" id="doneBtn">${S.read[sid] ? '✓ 읽었습니다 (취소하려면 누르기)' : '다 읽었어요'}</button>`;
  const note = S.notes[sid] || '';
  h += `<div class="card" style="margin-top:14px"><b class="small">나의 묵상 메모</b><textarea id="note" placeholder="이 원리를 내 삶에 어떻게 적용할까요?">${esc(note)}</textarea></div>`;
  h += `<div class="nav2">${prev ? `<a href="#/s/${prev}"><small>‹ 이전</small>${esc(shortT(SEC[prev].title))}</a>` : '<span style="flex:1"></span>'}${next ? `<a class="r" href="#/s/${next}"><small>다음 ›</small>${esc(shortT(SEC[next].title))}</a>` : '<span style="flex:1"></span>'}</div>`;
  V.innerHTML = h;
  S.last = sid; S.lastAt = Date.now(); save();
  $('#doneBtn').onclick = () => {
    if (S.read[sid]) delete S.read[sid]; else { S.read[sid] = today(); toast('읽음으로 표시했습니다'); }
    save();
    const b = $('#doneBtn'); b.className = 'btn done-btn' + (S.read[sid] ? '' : ' pri'); b.textContent = S.read[sid] ? '✓ 읽었습니다 (취소하려면 누르기)' : '다 읽었어요';
  };
  $('#note').oninput = e => { const t = e.target.value.trim(); S.noteAt = S.noteAt || {}; S.noteAt[sid] = Date.now(); if (t) S.notes[sid] = e.target.value; else delete S.notes[sid]; save(); };
  if (q){ const m = V.querySelector('mark'); if (m) setTimeout(() => m.scrollIntoView({block:'center'}), 50); }
}

let dzCat = -1, dzQ = '';
function vDz(){
  setTop('질병 찾기'); tab('d');
  V.innerHTML = `<div class="search"><input id="dq" type="search" placeholder="병명이나 증상 (예: 혈압, 갑상선, 불면)" value="${esc(dzQ)}"></div>
    <div class="chips" id="dc"><button class="chip ${dzCat<0?'on':''}" data-i="-1">전체</button>${DZ.map((c,i) => `<button class="chip ${dzCat===i?'on':''}" data-i="${i}">${c[1]} ${c[0]}</button>`).join('')}</div>
    <div id="dl"></div>
    <div style="margin-top:22px"><a class="btn" href="#/dch" style="display:block;text-align:center;text-decoration:none">📚 질병편 장별 목차로 보기</a></div>`;
  const draw = () => {
    const q = dzQ.trim().toLowerCase();
    let h = '';
    DZ.forEach((c, i) => {
      if (dzCat >= 0 && i !== dzCat) return;
      const items = c[2].filter(x => !q || (x[0] + ',' + x[2] + ',' + SEC[x[1]].title).toLowerCase().indexOf(q) >= 0);
      if (!items.length) return;
      h += `<div class="cat">${c[1]} ${c[0]}</div><div class="dz">` + items.map(x => `<a href="#/s/${x[1]}">${esc(x[0])}${S.read[x[1]] ? ' <span style="color:var(--g)">✓</span>' : ''}<small>${esc(shortT(SEC[x[1]].title).split(' — ')[0].slice(0,24))}</small></a>`).join('') + '</div>';
    });
    if (!h) h = `<div class="empty">찾는 병명이 목록에 없습니다.<br><a href="#/search?q=${encodeURIComponent(dzQ)}">강의 전체에서 「${esc(dzQ)}」 검색하기 ›</a></div>`;
    else if (q) h += `<p class="small" style="margin-top:16px"><a href="#/search?q=${encodeURIComponent(dzQ)}">강의 본문 전체에서 「${esc(dzQ)}」 찾아보기 ›</a></p>`;
    $('#dl').innerHTML = h;
  };
  $('#dq').oninput = e => { dzQ = e.target.value; draw(); };
  $('#dc').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; dzCat = +b.dataset.i; document.querySelectorAll('#dc .chip').forEach(x => x.classList.toggle('on', x === b)); draw(); };
  draw();
}

function vPlan(){
  setTop('나의 실천 — 뉴스타트'); tab('plan');
  const t = today(); const d = S.days[t] = S.days[t] || {};
  const tot = PLAN_ITEMS.length;
  const ring = n => { const r = 30, C = 2*Math.PI*r, p = n/tot; return `<svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--chip)" stroke-width="8"/><circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 38 38)"/><text x="38" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">${n}/${tot}</text></svg>`; };
  const week = () => { let h = ''; const wd = '일월화수목금토'; for (let i = 6; i >= 0; i--){ const x = new Date(); x.setDate(x.getDate() - i); const k = dkey(x); const p = dayScore(k)/tot; h += `<div>${i === 0 ? '오늘' : wd[x.getDay()]}<i><b style="height:${p*100}%"></b></i></div>`; } return h; };
  let streak = 0; for (let i = 0; ; i++){ const x = new Date(); x.setDate(x.getDate() - i); if (dayScore(dkey(x)) >= Math.ceil(tot/2)) streak++; else if (i > 0) break; else continue; if (i > 3650) break; }
  let h = `<div class="card"><div class="ring" id="ring">${ring(dayScore(t))}<div><b style="font-size:17px">오늘의 기본여건</b><div class="small muted">생기는 공짜지만 아무 자리에나 내려앉지 않습니다. 여덟 가지 여건을 하나씩 갖추어 가세요.</div>${streak ? `<div class="small" style="color:var(--g);font-weight:700;margin-top:4px">🔥 ${streak}일째 절반 이상 실천</div>` : ''}</div></div><div class="week" id="week">${week()}</div></div>`;
  h += `<p class="muted small" style="margin:0 4px 10px">NEWSTART — 식물은 영양·물·햇빛·절제·공기 다섯, 동물은 운동·휴식을 더해 일곱, 사람은 <b>신뢰</b>까지 여덟 가지가 필요합니다. 신뢰는 앞의 일곱을 살아 있게 만드는 항목입니다.</p>`;
  PLAN.forEach((p, i) => {
    const n = p.do.filter((_, j) => d[i + '.' + j]).length;
    h += `<details class="pc"><summary><span class="L">${p.ic}</span><span class="T"><b>${p.k} · ${p.ko}</b> <span class="small muted">${p.en}</span><small>${esc(p.one)}</small></span><span class="cnt" id="pc${i}">${n}/${p.do.length}</span></summary><div class="body"><div class="why">${esc(p.why)}</div>` +
      p.do.map((x, j) => `<label class="ck"><input type="checkbox" data-k="${i}.${j}" ${d[i+'.'+j] ? 'checked' : ''}><span>${esc(x)}</span></label>`).join('') +
      `<div class="lk">${p.links.filter(l => SEC[l]).map(l => `<a href="#/s/${l}">📖 ${esc(shortT(SEC[l].title).split(' — ')[0].slice(0,20))}</a>`).join('')}</div></div></details>`;
  });
  h += `<div class="card" style="margin-top:14px"><b>오늘의 감사 · 마음 일기</b><div class="small muted" style="margin-bottom:6px">원망의 언어를 의미의 언어로 바꾸어 적어 보세요.</div><textarea id="diary" placeholder="오늘 감사한 일, 내려놓은 응어리…">${esc((S.notes['day:' + t]) || '')}</textarea></div>`;
  h += `<a class="card" href="#/s/d10-3" style="display:block;text-decoration:none;color:inherit"><b>🌿 응어리를 푸는 법</b><div class="small muted">관계에서 · 몸으로 · 뜻으로 — 모든 질병에 공통된 실천</div></a>`;
  V.innerHTML = h;
  V.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => {
    const k = cb.dataset.k; if (cb.checked) d[k] = 1; else delete d[k]; save();
    const i = +k.split('.')[0]; $('#pc' + i).textContent = PLAN[i].do.filter((_, j) => d[i + '.' + j]).length + '/' + PLAN[i].do.length;
    $('#ring').firstElementChild.outerHTML = ring(dayScore(t)); $('#week').innerHTML = week();
    if (dayScore(t) === tot) toast('오늘 여덟 가지 여건을 모두 갖추었습니다 🌱');
  });
  $('#diary').oninput = e => { const v = e.target.value; S.noteAt = S.noteAt || {}; S.noteAt['day:' + t] = Date.now(); if (v.trim()) S.notes['day:' + t] = v; else delete S.notes['day:' + t]; save(); };
}

let allLoaded = null;
function loadAll(){ return allLoaded = allLoaded || Promise.all(Object.keys(CH).map(load)); }
async function vSearch(q){
  setTop('검색'); tab('');
  q = (q || '').trim();
  V.innerHTML = `<form class="search" id="sf"><input id="sq" type="search" placeholder="예: 메틸화, 엔도르핀, 현미, 용서" value="${esc(q)}"><button class="btn pri">찾기</button></form><div id="sr"></div>`;
  $('#sf').onsubmit = e => { e.preventDefault(); location.hash = '#/search?q=' + encodeURIComponent($('#sq').value.trim()); };
  if (!q){ $('#sq').focus(); $('#sr').innerHTML = '<p class="muted small">원리편·질병편 강의 전체(약 220만 자)에서 찾습니다. 처음 한 번은 자료를 내려받느라 몇 초 걸릴 수 있습니다.</p>'; return; }
  const ql = q.toLowerCase();
  const tHits = Object.values(SEC).filter(s => s.title.toLowerCase().indexOf(ql) >= 0);
  let h = '';
  if (tHits.length) h += `<h2 class="sec">제목에서 (${tHits.length})</h2><div class="res">` + tHits.slice(0, 50).map(s => `<a href="#/s/${s.id}"><b>${esc(s.title)}</b><small>${s.bk === 'p' ? '원리편' : '질병편'} · ${esc(CH[s.ch].title)}</small></a>`).join('') + '</div>';
  $('#sr').innerHTML = h + '<div class="empty" id="bodyRes">본문을 찾는 중…</div>';
  try { await loadAll(); } catch(e){ $('#bodyRes').textContent = '본문 자료를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'; return; }
  if (location.hash.indexOf('#/search') !== 0) return;
  const res = [];
  for (const cid of Object.keys(CH)){
    const c = await cache[cid];
    for (const s of c.s){
      let n = 0, snip = '';
      for (const b of s.b){ if (!b.x) continue; const t = strip(b.x); const i = t.toLowerCase().indexOf(ql); if (i >= 0){ n += t.toLowerCase().split(ql).length - 1; if (!snip) snip = (i > 40 ? '…' : '') + t.slice(Math.max(0, i - 40), i + 70) + '…'; } }
      if (n) res.push([s.id, n, snip]);
    }
  }
  res.sort((a, b) => b[1] - a[1]);
  const total = res.reduce((a, r) => a + r[1], 0);
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  $('#bodyRes').outerHTML = res.length ? `<h2 class="sec">본문에서 — ${res.length}개 주제, ${total}번</h2><div class="res">` + res.slice(0, 120).map(r => `<a href="#/s/${r[0]}?q=${encodeURIComponent(q)}"><b>${esc(SEC[r[0]].title)}</b> <span class="small muted">${r[1]}번</span><small>${esc(r[2]).replace(re, '<mark>$&</mark>')}</small></a>`).join('') + '</div>' : `<div class="empty">「${esc(q)}」이(가) 들어간 본문이 없습니다.</div>`;
}

function vMe(){
  setTop('내 기록'); tab('me');
  const ss = SYNC.status();
  let h = `<div class="card"><div style="display:flex;align-items:center;gap:12px"><span style="font-size:30px">🙂</span><span style="flex:1"><b style="font-size:17px">${esc(S.profile.name)}</b><div class="small muted">${phoneF(S.profile.phone)}${S.profile.group ? ' · ' + esc(S.profile.group) : ''}</div></span><a class="btn" href="#/profile" style="text-decoration:none;font-size:14px">고치기</a></div>
    <div class="small" style="margin-top:10px;color:${ss.err ? '#c0392b' : 'var(--sub)'}">${ss.err ? '⚠️ 서버 저장 안 됨: ' + esc(ss.err) : ss.at ? '☁️ 기록이 서버에 저장되었습니다 (' + ss.at.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}) + ')' : '☁️ 서버와 연결하는 중…'}</div></div>`;
  h += installBox();
  h += `<h2 class="sec">🔖 책갈피 (${S.marks.length})</h2>`;
  h += S.marks.length ? '<div class="card" style="padding:4px 14px"><ul class="list">' + S.marks.filter(m => SEC[m]).map(m => `<li><a href="#/s/${m}"><span class="n">${SEC[m].bk === 'p' ? '원리' : '질병'}</span><span class="t">${esc(SEC[m].title)}<small>${esc(CH[SEC[m].ch].title)}</small></span></a></li>`).join('') + '</ul></div>' : '<p class="muted small" style="margin:0 4px">읽는 화면 오른쪽 위 ☆을 누르면 여기에 모입니다.</p>';
  const notes = Object.keys(S.notes).filter(k => SEC[k]);
  h += `<h2 class="sec">✍️ 묵상 메모 (${notes.length})</h2>`;
  h += notes.length ? '<div class="res">' + notes.map(k => `<a href="#/s/${k}"><b>${esc(SEC[k].title)}</b><small>${esc(S.notes[k].slice(0, 120))}</small></a>`).join('') + '</div>' : '<p class="muted small" style="margin:0 4px">읽은 주제 아래에 메모를 남길 수 있습니다.</p>';
  const days = Object.keys(S.notes).filter(k => k.indexOf('day:') === 0).sort().reverse();
  if (days.length) h += `<h2 class="sec">📔 감사 · 마음 일기</h2><div class="res">` + days.slice(0, 60).map(k => `<a href="#/plan"><b>${k.slice(4)}</b><small>${esc(S.notes[k].slice(0, 140))}</small></a>`).join('') + '</div>';
  const rd = Object.keys(S.read);
  h += `<h2 class="sec">📚 읽은 주제 ${rd.length} / ${ORDER.length}</h2><div class="card">` + ['p','d'].map(bk => { const all = ORDER.filter(x => SEC[x].bk === bk); const r = all.filter(x => S.read[x]).length; return `<div style="margin-bottom:10px"><div class="small">${bk === 'p' ? '원리편' : '질병편'} ${r}/${all.length}</div><div class="bar"><i style="width:${r/all.length*100}%"></i></div></div>`; }).join('') + '</div>';
  h += `<h2 class="sec">기록 옮기기</h2><div class="card small"><div class="muted" style="margin-bottom:10px">기록은 이름·전화번호로 서버에도 저장되어 다른 기기에서 같은 이름·번호로 들어오면 이어집니다. 따로 보관하고 싶으면 백업 파일로 저장하세요.</div><button class="btn" id="bk">백업 파일 저장</button> <label class="btn" style="display:inline-block">불러오기<input type="file" id="rs" accept=".json" hidden></label></div>`;
  h += `<p style="text-align:center;margin-top:20px"><a href="#/about" class="small">이 자료에 대하여</a> · <span class="small muted">버전 ${VER}</span></p>`;
  V.innerHTML = h;
  $('#bk').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:'application/json'})); a.download = '건강원리_기록_' + today() + '.json'; a.click(); };
  $('#rs').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { const o = JSON.parse(t); if (!o.read) throw 0; if (!confirm('지금 기기의 기록을 백업 파일 내용으로 바꿀까요?')) return; S = o; save(); toast('기록을 불러왔습니다'); vMe(); } catch(x){ alert('올바른 백업 파일이 아닙니다.'); } }); };
}

function vAbout(){
  setTop('이 자료에 대하여', '#/');  tab('');
  V.innerHTML = '<article class="reader">' + IDX.p.front.map(f => '<h2 style="margin-top:20px">' + esc(f.title) + '</h2>' + blocks(f.b.map(b => b.t === 'h' ? b : b))).join('') + '</article>';
}

function route(){
  const hs = location.hash || '#/';
  const [path, qs] = hs.slice(1).split('?');
  const q = new URLSearchParams(qs || '').get('q') || '';
  const p = path.split('/').filter(Boolean);
  window.scrollTo(0, 0);
  if (!S.profile) return vGate(false);
  if (p[0] === 'profile') return vGate(true);
  document.body.classList.remove('gating'); $('.top').classList.remove('hide'); $('#tabs').classList.remove('hide');
  if (!p.length) return vHome();
  if (p[0] === 'p') return vBook('p');
  if (p[0] === 'dch') return vBook('d');
  if (p[0] === 'd') return vDz();
  if (p[0] === 'c') return vChapter(p[1]);
  if (p[0] === 's') return vSec(p[1], q);
  if (p[0] === 'plan') return vPlan();
  if (p[0] === 'search') return vSearch(q);
  if (p[0] === 'me') return vMe();
  if (p[0] === 'about') return vAbout();
  vHome();
}
window.addEventListener('hashchange', route);
$('#back').onclick = () => { if (history.length > 1 && cur.fromApp) history.back(); else location.hash = cur.back || '#/'; };
window.addEventListener('hashchange', () => { cur.fromApp = true; });

// 설정
function applySet(){
  document.documentElement.style.setProperty('--fs', (S.fs || 18) + 'px');
  if (S.theme && S.theme !== 'auto') document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('#fsSeg button').forEach(b => b.classList.toggle('on', +b.dataset.v === (S.fs || 18)));
  document.querySelectorAll('#thSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === (S.theme || 'auto')));
}
$('#setBtn').onclick = () => $('#sheet').classList.add('on');
$('#shClose').onclick = () => $('#sheet').classList.remove('on');
$('#sheet').onclick = e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('on'); };
$('#fsSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.fs = +b.dataset.v; save(); applySet(); };
$('#thSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.theme = b.dataset.v; save(); applySet(); };
applySet();
S.visits = S.visits || []; if (S.visits[S.visits.length - 1] !== today()){ S.visits.push(today()); S.visits = S.visits.slice(-400); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
route();
if (S.profile) window.addEventListener('load', () => SYNC.init());
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
