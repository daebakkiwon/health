<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>건강원리 관리자</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>window.FB_CONFIG = {"apiKey":"AIzaSyDT2snkVUWznnrRfCv50aLbLL8VRDKyR40","authDomain":"seomgim-growth.firebaseapp.com","projectId":"seomgim-growth","storageBucket":"seomgim-growth.firebasestorage.app","messagingSenderId":"479785468927","appId":"1:479785468927:web:4381a352eb691f6194ddca"};</script>
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#1f2a24;--sub:#5d6b62;--line:#e2dccd;--g:#2f6b4f;--g2:#e3efe6;--warn:#b5651d;--red:#c0392b}
@media (prefers-color-scheme: dark){:root{--bg:#141916;--card:#1d2420;--ink:#e7ece8;--sub:#9fb0a6;--line:#2e3833;--g:#7cc4a0;--g2:#22352b;--warn:#e0a060;--red:#ef7a6d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center}
header h1{font-size:17px;margin:0;flex:1}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.login{max-width:380px;margin:40px auto}
.login input{width:100%;margin-bottom:10px}
.err{color:var(--red);font-size:14px;min-height:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--sub)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1;min-width:180px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12.5px;color:var(--sub);cursor:pointer;user-select:none;background:var(--card);position:sticky;top:0}
th.on{color:var(--g)}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--g2)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--g2);color:var(--g)}
.tag.hold{background:#fbe9d7;color:var(--warn)}
.tag.done{background:#e3e8f7;color:#3b5aa5}
.muted{color:var(--sub)}
.small{font-size:13px}
.pbar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;overflow:hidden;margin-right:6px}
.pbar i{display:block;height:100%;background:var(--g)}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);border-left:1px solid var(--line);z-index:10;overflow-y:auto;padding:18px;box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(105%);transition:.2s}
.panel.on{transform:none}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;margin:12px 0}
.kv span:nth-child(odd){color:var(--sub)}
.panel textarea,.panel select,.panel input{width:100%}
.panel label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.hint{font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<header><h1>🌱 건강원리 관리자</h1><span class="small muted" id="who"></span><button class="btn sm" id="out" hidden>로그아웃</button></header>
<main id="view"><div class="empty">불러오는 중…</div></main>
<aside class="panel" id="panel"></aside>
<script>
const TOTAL = {"p": 319, "d": 149, "all": 468};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const phoneF = p => String(p || '').replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
const ms = x => x && x.toMillis ? x.toMillis() : 0;
const pad = n => (n < 10 ? '0' : '') + n;
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dayAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dkey(d); };
const ago = t => { if (!t) return '-'; const d = Math.floor((Date.now() - t) / 86400000); return d <= 0 ? '오늘' : d === 1 ? '어제' : d + '일 전'; };
const fmtD = t => t ? new Date(t).toLocaleDateString('ko-KR', {year: '2-digit', month: 'numeric', day: 'numeric'}) : '-';
const STATUS = {'': ['참여 중', ''], hold: ['보류', 'hold'], done: ['수료', 'done']};
let FS, PEOPLE = [], SORT = {k: 'last', d: -1}, F = {q: '', g: '', s: 'all'}, OPEN = null;

firebase.initializeApp(window.FB_CONFIG);
FS = firebase.firestore();
firebase.auth().onAuthStateChanged(async u => {
  if (!u || u.isAnonymous) return login();
  try {
    const d = await FS.collection('leaders').doc(u.uid).get();
    const L = d.exists ? d.data() : null;
    if (!L || !L.approved || L.role !== 'all') return login('관리 권한이 없는 계정입니다. 섬김성장노트의 총리더 계정으로 들어와 주세요.');
    $('#who').textContent = L.name || u.email;
  } catch(e){ return login('계정 정보를 확인하지 못했습니다: ' + (e.code || e.message)); }
  $('#out').hidden = false;
  load();
});
function login(msg){
  $('#out').hidden = true; $('#who').textContent = '';
  $('#view').innerHTML = `<div class="card login"><h2 style="margin-top:0">관리자 로그인</h2><p class="hint">섬김성장노트 총리더 계정(이메일·비밀번호)으로 들어옵니다.</p>
    <input type="email" id="em" placeholder="이메일" autocomplete="username"><input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
    <div class="err" id="er">${esc(msg || '')}</div><button class="btn pri" id="go" style="width:100%">들어가기</button>
    <button class="btn" id="fg" style="width:100%;margin-top:8px">비밀번호를 잊으셨나요?</button></div>`;
  const go = async () => { $('#er').textContent = ''; try { await firebase.auth().signInWithEmailAndPassword($('#em').value.trim(), $('#pw').value); } catch(e){ $('#er').textContent = '이메일이나 비밀번호가 맞지 않습니다'; } };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#fg').onclick = async () => {
    const em = $('#em').value.trim(); if (!em) return $('#er').textContent = '위 칸에 이메일을 먼저 넣고 다시 눌러 주세요';
    try { firebase.auth().languageCode = 'ko'; await firebase.auth().sendPasswordResetEmail(em); $('#er').style.color = 'var(--g)'; $('#er').textContent = em + ' 로 비밀번호 재설정 메일을 보냈습니다.'; }
    catch(e){ $('#er').textContent = '메일을 보내지 못했습니다: ' + (e.code || e.message); }
  };
  if (msg) firebase.auth().signOut();
}
$('#out').onclick = () => firebase.auth().signOut();

async function load(){
  $('#view').innerHTML = '<div class="empty">불러오는 중…</div>';
  try {
    const q = await FS.collection('healthu').get();
    PEOPLE = q.docs.map(d => Object.assign({id: d.id}, d.data(), {_up: ms(d.data().updated), _join: ms(d.data().joined) || ms(d.data().updated)}));
    draw();
  } catch(e){
    $('#view').innerHTML = `<div class="card"><b>명단을 불러오지 못했습니다</b><p class="hint">${e.code === 'permission-denied' ? 'Firebase 보안 규칙에 healthu 부분이 아직 없거나, 총리더 권한이 없는 계정입니다. 「파이어베이스_규칙_추가.txt」의 내용을 규칙에 붙여 넣어 주세요.' : esc(e.code || e.message)}</p><button class="btn" onclick="load()">다시 시도</button></div>`;
  }
}
const groupOf = p => p.agroup || p.group || '';
function rows(){
  const q = F.q.trim().toLowerCase(), qd = q.replace(/\D/g, '');
  let r = PEOPLE.filter(p => {
    if (F.g && groupOf(p) !== F.g) return false;
    if (F.s !== 'all' && (p.status || '') !== F.s) return false;
    if (q && !((p.name || '').toLowerCase().includes(q) || (qd && (p.phone || '').includes(qd)) || groupOf(p).toLowerCase().includes(q) || (p.memo || '').toLowerCase().includes(q))) return false;
    return true;
  });
  const key = {name: p => p.name || '', group: p => groupOf(p), join: p => p._join, last: p => p._up, read: p => p.readN || 0, plan: p => p.planDays || 0, visit: p => p.visitN || 0}[SORT.k];
  r.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * SORT.d; });
  return r;
}
function draw(){
  const t = dayAgo(0), w = dayAgo(6);
  const n = PEOPLE.length;
  const today = PEOPLE.filter(p => (p.lastVisit || '') >= t).length;
  const week = PEOPLE.filter(p => (p.lastVisit || '') >= w).length;
  const inst = PEOPLE.filter(p => p.installed).length;
  const newW = PEOPLE.filter(p => p._join >= Date.now() - 7 * 864e5).length;
  const groups = [...new Set(PEOPLE.map(groupOf).filter(Boolean))].sort();
  const R = rows();
  const th = (k, l) => `<th data-k="${k}" class="${SORT.k === k ? 'on' : ''}">${l}${SORT.k === k ? (SORT.d > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  $('#view').innerHTML = `
  <div class="stats">
    <div class="stat"><b>${n}</b><span>등록한 사람</span></div>
    <div class="stat"><b>${today}</b><span>오늘 들어온 사람</span></div>
    <div class="stat"><b>${week}</b><span>최근 7일 활동</span></div>
    <div class="stat"><b>${newW}</b><span>최근 7일 새로 등록</span></div>
    <div class="stat"><b>${inst}</b><span>홈 화면 설치 (${n ? Math.round(inst / n * 100) : 0}%)</span></div>
  </div>
  <div class="bar">
    <input type="search" id="q" placeholder="이름·번호·소속·메모로 찾기" value="${esc(F.q)}">
    <select id="g"><option value="">소속 전체</option>${groups.map(g => `<option ${F.g === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>
    <select id="s"><option value="all">상태 전체</option>${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${F.s === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>
    <button class="btn" id="csv">엑셀(CSV) 내려받기</button>
    <button class="btn" id="rf">새로고침</button>
  </div>
  <div class="small muted" style="margin:0 2px 8px">${R.length}명 표시 · 줄을 누르면 자세히 보고 소속·상태·메모를 고칠 수 있습니다.</div>
  <div class="tw"><table><thead><tr>${th('name', '이름')}<th>전화번호</th>${th('group', '소속')}<th>상태</th>${th('read', '읽은 주제')}${th('plan', '실천한 날')}${th('visit', '접속일')}${th('last', '마지막 활동')}${th('join', '등록일')}<th>설치</th></tr></thead><tbody>
  ${R.map(p => `<tr class="row" data-id="${p.id}"><td><b>${esc(p.name)}</b></td><td>${phoneF(p.phone)}</td><td>${esc(groupOf(p)) || '<span class="muted">-</span>'}</td><td><span class="tag ${STATUS[p.status || ''][1]}">${STATUS[p.status || ''][0]}</span></td>
    <td><span class="pbar"><i style="width:${Math.min(100, (p.readN || 0) / TOTAL.all * 100)}%"></i></span>${p.readN || 0}</td><td>${p.planDays || 0}일</td><td>${p.visitN || 0}일</td><td>${ago(p._up)}</td><td>${fmtD(p._join)}</td><td>${p.installed ? '📲' : '<span class="muted">-</span>'}</td></tr>`).join('') || `<tr><td colspan="10" class="empty">${n ? '조건에 맞는 사람이 없습니다' : '아직 등록한 사람이 없습니다'}</td></tr>`}
  </tbody></table></div>`;
  $('#q').oninput = e => { F.q = e.target.value; const pos = e.target.selectionStart; draw(); const i = $('#q'); i.focus(); i.setSelectionRange(pos, pos); };
  $('#g').onchange = e => { F.g = e.target.value; draw(); };
  $('#s').onchange = e => { F.s = e.target.value; draw(); };
  $('#rf').onclick = load;
  $('#csv').onclick = csv;
  document.querySelectorAll('th[data-k]').forEach(h => h.onclick = () => { const k = h.dataset.k; SORT = {k, d: SORT.k === k ? -SORT.d : (k === 'name' || k === 'group' ? 1 : -1)}; draw(); });
  document.querySelectorAll('tr.row').forEach(tr => tr.onclick = () => openP(tr.dataset.id));
}
function openP(id){
  const p = PEOPLE.find(x => x.id === id); if (!p) return; OPEN = id;
  const dev = Object.values(p.devices || {});
  $('#panel').innerHTML = `<div style="display:flex;align-items:center;gap:8px"><b style="font-size:20px;flex:1">${esc(p.name)}</b><button class="btn sm" id="pc">닫기 ✕</button></div>
    <div style="margin-top:6px"><a class="btn sm" href="tel:${esc(p.phone)}">📞 전화</a> <a class="btn sm" href="sms:${esc(p.phone)}">💬 문자</a></div>
    <div class="kv">
      <span>전화번호</span><span>${phoneF(p.phone)}</span>
      <span>본인이 적은 소속</span><span>${esc(p.group) || '-'}</span>
      <span>등록일</span><span>${fmtD(p._join)}</span>
      <span>마지막 활동</span><span>${p._up ? new Date(p._up).toLocaleString('ko-KR') : '-'}</span>
      <span>접속한 날</span><span>${p.visitN || 0}일 (마지막 ${esc(p.lastVisit || '-')})</span>
      <span>읽은 주제</span><span>${p.readN || 0} / ${TOTAL.all} (원리편 ${p.readP || 0}/${TOTAL.p} · 질병편 ${p.readD || 0}/${TOTAL.d})</span>
      <span>마지막 읽은 곳</span><span>${esc(p.lastTitle) || '-'}</span>
      <span>뉴스타트 실천</span><span>${p.planDays || 0}일 (마지막 ${esc(p.lastPlan || '-')})</span>
      <span>메모·책갈피</span><span>메모 ${p.noteN || 0} · 책갈피 ${p.markN || 0}</span>
      <span>홈 화면 설치</span><span>${p.installed ? '설치함 (' + esc(p.installed) + ')' : '아직'}</span>
      <span>사용 기기</span><span>${esc([...new Set(dev)].join(', ') || p.ua || '-')}</span>
    </div>
    <label>관리용 소속 (비우면 본인이 적은 소속을 씁니다)</label><input id="ag" value="${esc(p.agroup || '')}" placeholder="${esc(p.group || '예: 1기, ○○교회')}">
    <label>상태</label><select id="st">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${(p.status || '') === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>
    <label>관리 메모 (앱 화면에는 나오지 않습니다)</label><textarea id="mm" rows="4" placeholder="상담 내용, 건강 상태, 연락 기록 등">${esc(p.memo || '')}</textarea>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="sv" style="flex:1">저장</button><button class="btn red" id="dl">명단에서 삭제</button></div>
    <div class="err" id="pe" style="margin-top:8px"></div>
    <p class="hint">삭제하면 이 사람의 서버 기록(읽은 주제·실천·메모)이 지워집니다. 본인이 앱을 다시 열면 그 기기에 남은 기록으로 다시 등록됩니다.</p>`;
  $('#panel').classList.add('on');
  $('#pc').onclick = () => { $('#panel').classList.remove('on'); OPEN = null; };
  $('#sv').onclick = async () => {
    const patch = {agroup: $('#ag').value.trim(), status: $('#st').value, memo: $('#mm').value, adminAt: firebase.firestore.FieldValue.serverTimestamp()};
    try { await FS.collection('healthu').doc(id).set(patch, {merge: true}); Object.assign(p, patch); draw(); $('#pe').style.color = 'var(--g)'; $('#pe').textContent = '저장했습니다'; }
    catch(e){ $('#pe').textContent = '저장하지 못했습니다: ' + (e.code || e.message); }
  };
  $('#dl').onclick = async () => {
    if (!confirm(p.name + '님을 명단에서 삭제할까요? 서버에 있는 기록도 함께 지워집니다.')) return;
    try { await FS.collection('healthu').doc(id).delete(); PEOPLE = PEOPLE.filter(x => x.id !== id); $('#panel').classList.remove('on'); draw(); }
    catch(e){ $('#pe').textContent = '삭제하지 못했습니다: ' + (e.code || e.message); }
  };
}
function csv(){
  const head = ['이름', '전화번호', '소속', '본인소속', '상태', '읽은주제', '원리편', '질병편', '실천일수', '마지막실천', '접속일수', '마지막접속', '마지막활동', '등록일', '설치', '관리메모'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [head.map(q).join(',')].concat(rows().map(p => [p.name, phoneF(p.phone), groupOf(p), p.group, STATUS[p.status || ''][0], p.readN || 0, p.readP || 0, p.readD || 0, p.planDays || 0, p.lastPlan, p.visitN || 0, p.lastVisit, p._up ? new Date(p._up).toLocaleString('ko-KR') : '', fmtD(p._join), p.installed ? '설치' : '', p.memo].map(q).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv'}));
  a.download = '건강원리_명단_' + dkey(new Date()) + '.csv'; a.click();
}
</script>
</body>
</html>
